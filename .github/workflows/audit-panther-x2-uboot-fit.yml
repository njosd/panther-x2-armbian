name: Audit Panther X2 U-Boot FIT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-uboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository evidence
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install static inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y u-boot-tools device-tree-compiler binutils-aarch64-linux-gnu file

      - name: Verify the exact uploaded eMMC FIT evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/report
          source_file="evidence/boot/panther-x2-u-boot.itb"
          test -f "$source_file"
          cp "$source_file" audit/input/panther-x2-u-boot.itb

          blob_sha=$(git hash-object "$source_file")
          sha256=$(sha256sum "$source_file" | awk '{print $1}')
          size=$(stat -c '%s' "$source_file")
          {
            echo "Evidence source: $source_file"
            echo "Git blob SHA-1: $blob_sha"
            echo "SHA-256: $sha256"
            echo "Size: $size bytes"
            echo
            echo "Expected Git blob SHA-1: 04cd10bddd4e823d2ea495ee95b264cb2bce1f4c"
            echo "Expected SHA-256: 3a662accda44a1efcb7822972f701dc95ef07a81830f7679440de04d916ab0af"
            echo "Expected size: 1431552 bytes"
          } | tee audit/report/input-identity.txt

          test "$blob_sha" = "04cd10bddd4e823d2ea495ee95b264cb2bce1f4c"
          test "$sha256" = "3a662accda44a1efcb7822972f701dc95ef07a81830f7679440de04d916ab0af"
          test "$size" = "1431552"

      - name: Inspect FIT and extract payloads
        shell: bash
        run: |
          set -euo pipefail
          fit="audit/input/panther-x2-u-boot.itb"
          {
            echo "===== FIT listing ====="
            dumpimage -l "$fit"
            echo
            echo "===== FIT strings ====="
            strings -a -t x "$fit" | grep -Ei 'vendor_storage|LAN_MAC|ethaddr|eth1addr|rockchip_set_ethaddr|MAC addresses|local-mac-address|gmac|ethernet|fdt' || true
          } 2>&1 | tee audit/report/fit-inspection.txt

          python3 - <<'PY'
          import hashlib, struct
          from pathlib import Path

          src = Path("audit/input/panther-x2-u-boot.itb")
          out = Path("audit/extracted")
          report = Path("audit/report")
          blob = src.read_bytes()
          fields = struct.unpack(">10I", blob[:40])
          magic, total, off_struct, off_strings, _off_mem, _ver, _last, _boot, size_strings, size_struct = fields
          if magic != 0xd00dfeed or total > len(blob):
              raise SystemExit("Invalid FIT/FDT header")

          strings = blob[off_strings:off_strings + size_strings]
          def string_at(offset):
              end = strings.find(bytes([0]), offset)
              if end < 0:
                  raise ValueError("Invalid FDT string-table offset")
              return strings[offset:end].decode()

          nodes = {}
          stack = []
          pos = off_struct
          struct_end = off_struct + size_struct
          while pos < struct_end:
              token = struct.unpack_from(">I", blob, pos)[0]
              pos += 4
              if token == 1:  # FDT_BEGIN_NODE
                  end = blob.find(bytes([0]), pos)
                  if end < 0:
                      raise ValueError("Unterminated FDT node name")
                  stack.append(blob[pos:end].decode())
                  pos = (end + 4) & ~3
              elif token == 2:  # FDT_END_NODE
                  if not stack:
                      raise ValueError("Unbalanced FDT_END_NODE")
                  stack.pop()
              elif token == 3:  # FDT_PROP
                  length, nameoff = struct.unpack_from(">II", blob, pos)
                  pos += 8
                  name = string_at(nameoff)
                  value = blob[pos:pos + length]
                  if len(value) != length:
                      raise ValueError("Truncated FDT property")
                  pos = (pos + length + 3) & ~3
                  nodes.setdefault("/".join(stack), {})[name] = value
              elif token == 4:  # FDT_NOP
                  continue
              elif token == 9:  # FDT_END
                  break
              else:
                  raise ValueError(f"Unknown FDT token {token:#x} at {pos - 4:#x}")

          # This FIT stores external payloads at a 256-byte-aligned base after
          # the FDT structure. Every extracted payload is accepted only after
          # matching its own SHA-256 hash node.
          data_base = (total + 0xff) & ~0xff
          lines = [f"FIT totalsize: 0x{total:x}", f"External data base: 0x{data_base:x}", ""]
          for path, props in nodes.items():
              if not path.startswith("/images/") or "data-size" not in props:
                  continue
              name = path.rsplit("/", 1)[-1]
              size = int.from_bytes(props["data-size"], "big")
              if "data-position" in props:
                  offset = int.from_bytes(props["data-position"], "big")
              elif "data-offset" in props:
                  offset = data_base + int.from_bytes(props["data-offset"], "big")
              else:
                  raise ValueError(f"{name}: no external data-position/data-offset")
              if offset + size > len(blob):
                  raise ValueError(f"{name}: payload extends beyond FIT file")
              data = blob[offset:offset + size]
              hash_props = nodes.get(path + "/hash", {})
              expected = hash_props.get("value", b"").hex()
              actual = hashlib.sha256(data).hexdigest()
              if not expected or actual != expected:
                  raise ValueError(f"{name}: SHA-256 mismatch expected={expected} actual={actual}")
              dest = out / ("u-boot-proper.bin" if name == "uboot" else f"{name}.bin")
              dest.write_bytes(data)
              image_type = props.get("type", b"").rstrip(bytes([0])).decode(errors="replace")
              lines.append(f"{name}: type={image_type} offset=0x{offset:x} size={size} sha256={actual} VERIFIED")
          if not (out / "u-boot-proper.bin").is_file() or not (out / "fdt.bin").is_file():
              raise SystemExit("Required U-Boot proper or FDT payload not found")
          (report / "verified-payloads.txt").write_text(chr(10).join(lines) + chr(10))
          print(chr(10).join(lines))
          PY

          dtc -I dtb -O dts -o audit/extracted/fdt.dts audit/extracted/fdt.bin 2>audit/extracted/fdt-dtc-warnings.txt
          {
            echo "===== FIT FDT details ====="
            grep -Ein -C 3 'model|compatible|ethernet|gmac|mac-address|local-mac-address|aliases' audit/extracted/fdt.dts || true
          } | tee audit/report/fdt-details.txt

          {
            echo "U-Boot proper SHA-256:"
            sha256sum audit/extracted/u-boot-proper.bin
            echo "U-Boot proper size:"
            stat -c '%s bytes' audit/extracted/u-boot-proper.bin
          } | tee audit/report/proper-extraction.txt

      - name: Disassemble U-Boot proper and index relevant strings
        shell: bash
        run: |
          set -euo pipefail
          binary="audit/extracted/u-boot-proper.bin"
          {
            echo "===== Extracted U-Boot proper identity ====="
            file "$binary"
            stat -c '%n %s bytes' "$binary"
            sha256sum "$binary"
            echo
            echo "===== Relevant strings with file offsets ====="
            strings -a -t x "$binary" | tee audit/report/u-boot-proper-strings.txt
            echo
            echo "===== Vendor Storage / MAC / Ethernet string index ====="
            grep -Ein -C 2 'vendor_storage|LAN_MAC|ethaddr|eth1addr|rockchip_set_ethaddr|MAC addresses|using MAC address from ROM|local-mac-address|gmac|ethernet|not set|failed' audit/report/u-boot-proper-strings.txt || true
          } 2>&1 | tee audit/report/proper-strings-analysis.txt

          aarch64-linux-gnu-objdump \
            -D -b binary -m aarch64 --adjust-vma=0x00a00000 \
            --show-raw-insn "$binary" \
            > audit/report/u-boot-proper.disasm.txt

          {
            echo "Disassembly generated from the extracted raw AArch64 payload."
            echo "Virtual address base used: 0x00a00000 (FIT load address)."
            echo "The payload is a raw binary, not an ELF with symbols; function names and boundaries are not automatically available."
            echo "String presence does not prove a function was called or that Vendor Storage was read at boot."
            echo "Use string file offsets together with instruction-level references and call flow; account for literal pools and relocation-free raw-image layout."
            echo "No target device, bootloader, flash, Vendor Storage, or runtime configuration was accessed or modified."
            echo
            echo "Disassembly line count:"
            wc -l audit/report/u-boot-proper.disasm.txt
          } | tee audit/report/disassembly-notes.txt

      - name: Resolve direct AArch64 references to MAC and Vendor Storage strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          load = 0x00a00000
          strings_path = Path("audit/report/u-boot-proper-strings.txt")
          disasm_path = Path("audit/report/u-boot-proper.disasm.txt")
          terms = re.compile(
              r"vendor_storage|LAN_MAC|ethaddr|eth1addr|rockchip_set_ethaddr|"
              r"MAC addresses|using MAC address from ROM|local-mac-address|"
              r"gmac|ethernet", re.I
          )
          targets = []
          for line in strings_path.read_text(errors="replace").splitlines():
              m = re.match(r"\s*([0-9a-fA-F]+)\s+(.*)", line)
              if m and terms.search(m.group(2)):
                  off = int(m.group(1), 16)
                  targets.append((load + off, m.group(2)))

          lines = disasm_path.read_text(errors="replace").splitlines()
          hits = []
          adrp_re = re.compile(r"^\s*([0-9a-f]+):.*?\badrp\s+(x\d+),\s*#?(0x[0-9a-f]+)", re.I)
          add_re = re.compile(r"^\s*([0-9a-f]+):.*?\badd\s+(x\d+),\s*(x\d+),\s*#(0x[0-9a-f]+|[0-9]+)", re.I)
          adr_re = re.compile(r"^\s*([0-9a-f]+):.*?\badr\s+(x\d+),\s*#?(0x[0-9a-f]+)", re.I)

          for i, line in enumerate(lines):
              m = adr_re.search(line)
              if m:
                  pc, reg, dest = int(m.group(1),16), m.group(2), int(m.group(3),16)
                  for target, value in targets:
                      if dest == target:
                          hits.append((i, pc, target, value, "ADR"))
              m = adrp_re.search(line)
              if not m:
                  continue
              pc, reg, page = int(m.group(1),16), m.group(2), int(m.group(3),16)
              for j in range(i + 1, min(i + 8, len(lines))):
                  a = add_re.search(lines[j])
                  if a and a.group(2) == reg and a.group(3) == reg:
                      dest = page + int(a.group(4), 0)
                      for target, value in targets:
                          if dest == target:
                              hits.append((i, pc, target, value, "ADRP+ADD"))
                      break
                  if re.search(rf"\b{reg}\b", lines[j]) and not re.search(r"\b(?:add|nop)\b", lines[j]):
                      break

          out = Path("audit/report/string-cross-references.txt")
          with out.open("w") as f:
              f.write("Static direct-reference scan; not a complete data-flow or decompiler analysis.\n")
              f.write("A zero-hit result does not prove strings are unused.\n")
              f.write(f"Relevant strings indexed: {len(targets)}\n")
              f.write(f"Direct ADR / ADRP+ADD matches: {len(hits)}\n\n")
              for idx, pc, target, value, kind in hits:
                  f.write(f"{kind}: code=0x{pc:x} string=0x{target:x} text={value}\n")
                  for k in range(max(0, idx-12), min(len(lines), idx+18)):
                      f.write(lines[k] + "\n")
                  f.write("\n")
          print(out.read_text())
          PY

      - name: Publish static audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panther-x2-uboot-fit-audit
          path: audit/
          if-no-files-found: warn
          retention-days: 30
