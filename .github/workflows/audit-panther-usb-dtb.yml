name: Audit Panther X2 USB device tree (Ophub 6.12.81, patched)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout audit repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install device-tree build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev device-tree-compiler python3

      - name: Fetch exact Ophub kernel source
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.env
          git clone --filter=blob:none --no-checkout "$OPHUB_RK35XX_KERNEL_SOURCE_REPO" kernel
          git -C kernel fetch --depth=1 origin "$OPHUB_RK35XX_KERNEL_SOURCE_COMMIT"
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "$OPHUB_RK35XX_KERNEL_SOURCE_COMMIT"
          {
            echo "Source repository: $OPHUB_RK35XX_KERNEL_SOURCE_REPO"
            echo "Pinned commit: $(git -C kernel rev-parse HEAD)"
            echo "DTS source: arch/arm64/boot/dts/rockchip/rk3566-panther-x2.dts"
          } | tee source-revision.txt

      - name: Apply the isolated Panther X2 USB2 Host PHY fix
        shell: bash
        run: |
          set -euo pipefail
          git -C kernel apply --check patches/panther-x2-usb2-host-phy.patch
          git -C kernel apply patches/panther-x2-usb2-host-phy.patch
          dts=kernel/arch/arm64/boot/dts/rockchip/rk3566-panther-x2.dts
          test "$(grep -c 'phys = <&u2phy0_host>;' "$dts")" -eq 2
          test "$(grep -c '<&usb2phy0>;' "$dts")" -eq 2
          if grep -A8 -E '^&usb_host0_(ehci|ohci) \{' "$dts" | grep -q 'usb2phy1'; then
            echo "::error::USB Host still references PHY1"
            exit 1
          fi
          echo "USB2 Host DTS patch applied and source-level checks passed."

      - name: Build the merged Panther X2 DTB
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          make ARCH=arm64 defconfig

      - name: Build the merged Panther X2 DTB
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          make ARCH=arm64 defconfig
          make ARCH=arm64 -j"$(nproc)" dtbs
          test -s arch/arm64/boot/dts/rockchip/rk3566-panther-x2.dtb
          mkdir -p ../audit
          cp arch/arm64/boot/dts/rockchip/rk3566-panther-x2.dtb ../audit/
          sha256sum ../audit/rk3566-panther-x2.dtb > ../audit/dtb-sha256.txt
          dtc -I dtb -O dts -o ../audit/rk3566-panther-x2.merged.dts ../audit/rk3566-panther-x2.dtb 2> ../audit/dtc-warnings.txt

      - name: Verify merged USB Host references
        shell: bash
        run: |
          set -euo pipefail
          dts=audit/rk3566-panther-x2.merged.dts
          for node in fd800000 fd840000; do
            awk -v node="$node" '
              $0 ~ node "\.usb" { in_node=1 }
              in_node { print }
              in_node && /^\t};/ { exit }
            ' "$dts"
          done
          grep -q 'usb2phy0' "$dts"
          grep -q 'u2phy0_host' "$dts"
          if grep -A20 -E 'usb@fd800000|usb@fd840000' "$dts" | grep -q 'usb2phy1'; then
            echo "::error::Merged DTB still references USB PHY1"
            exit 1
          fi

      - name: Extract final USB topology and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path("audit/rk3566-panther-x2.merged.dts").read_text()
          out = pathlib.Path("audit/usb-topology-report.txt")
          names = [
              "usbdrd30", "usbdrd_dwc3", "usbhost30", "usbhost_dwc3",
              "usb_host0_xhci", "usb_host0_ehci", "usb_host0_ohci",
              "usb_host1_ehci", "usb_host1_ohci",
              "usb2phy0", "u2phy0_host", "u2phy0_otg",
              "usb2phy1", "u2phy1_host", "u2phy1_otg",
          ]
          lines = ["Merged DTB USB topology audit", "This report describes the built DTB, not physical PCB routing.", ""]
          for name in names:
              lines.append(f"===== {name} =====")
              candidates = [b for b in re.findall(r"(?ms)^\\s*[^\\n{]+\\s*\\{.*?^\\s*\\};", src) if name in b]
              lines.extend(candidates[:2] or ["No textual label/reference found in decompiled DTB."])
              lines.append("")
          out.write_text("\\n".join(lines))
          print(out.read_text())
          PY
          grep -n -E -B5 -A18 'usbdrd|usbhost|usb_host0|usb_host1|usb2phy0|usb2phy1|u2phy0|u2phy1' audit/rk3566-panther-x2.merged.dts > audit/usb-topology-excerpts.txt || true

      - name: Upload merged DTB and audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panther-x2-6.12.81-patched-usb-dtb-audit
          path: |
            source-revision.txt
            audit/rk3566-panther-x2.dtb
            audit/dtb-sha256.txt
            audit/rk3566-panther-x2.merged.dts
            audit/dtc-warnings.txt
            audit/usb-topology-report.txt
            audit/usb-topology-excerpts.txt
          if-no-files-found: error
          retention-days: 30
