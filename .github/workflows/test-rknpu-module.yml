name: Test RK3566 RKNPU module against Ophub 6.18.63

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install cross-build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             bc bison build-essential device-tree-compiler dpkg-dev             file flex gcc-aarch64-linux-gnu libelf-dev libssl-dev

      - name: Install matching Arm GNU Toolchain 15.3.1
        shell: bash
        run: |
          set -euo pipefail
          toolchain_archive="$RUNNER_TEMP/arm-gnu-toolchain-15.3.rel1.tar.xz"
          toolchain_root="$RUNNER_TEMP/arm-gnu-toolchain-15.3.rel1"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
            -o "$toolchain_archive"
          mkdir -p "$toolchain_root"
          tar -xJf "$toolchain_archive" --strip-components=1 -C "$toolchain_root"
          echo "$toolchain_root/bin" >> "$GITHUB_PATH"
          compiler_version="$("$toolchain_root/bin/aarch64-none-linux-gnu-gcc" -dumpfullversion)"
          if [[ "$compiler_version" != "15.3.1" ]]; then
            echo "::error::Expected GCC 15.3.1, found $compiler_version"
            exit 1
          fi
          {
            echo "Arm GNU Toolchain archive SHA256: $(sha256sum "$toolchain_archive" | awk '{print $1}')"
            "$toolchain_root/bin/aarch64-none-linux-gnu-gcc" --version | head -n1
            echo "Verified GCC version: $compiler_version"
          } | tee "$RUNNER_TEMP/arm-toolchain-version.txt"

      - name: Fetch fixed kernel package and RKNPU source
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.env
          mkdir -p work/kernel work/headers work/rknpu work/reports

          # Obtain the matching 6.18.63 source tree for HOST-side Kbuild tools.
          # The binary package's prepared headers are retained as the output tree.
          git clone --filter=blob:none --no-checkout \
            "$OPHUB_KERNEL_SOURCE_REPO" work/kernel-source
          git -C work/kernel-source fetch --depth=1 origin "$OPHUB_KERNEL_SOURCE_COMMIT"
          git -C work/kernel-source checkout --detach FETCH_HEAD
          source_version="$(sed -n 's/^SUBLEVEL = //p' work/kernel-source/Makefile | head -n1)"
          patchlevel="$(sed -n 's/^PATCHLEVEL = //p' work/kernel-source/Makefile | head -n1)"
          version="$(sed -n 's/^VERSION = //p' work/kernel-source/Makefile | head -n1)"
          if [[ "$version.$patchlevel.$source_version" != "6.18.63" ]]; then
            echo "::error::Kernel source checkout is not 6.18.63"
            exit 1
          fi

          curl --fail --location --retry 3 --retry-delay 3 \
            "${KERNEL_PACKAGE_URL}" -o work/kernel/kernel.tar.gz
          echo "${KERNEL_PACKAGE_SHA256}  work/kernel/kernel.tar.gz" | sha256sum --check

          mapfile -t header_members < <(
            tar -tzf work/kernel/kernel.tar.gz |
              grep -E "^6\\.18\\.63/header-[^/]+\\.tar\\.gz$"
          )
          if [[ "${#header_members[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one 6.18.63 header archive; found ${#header_members[@]}"
            tar -tzf work/kernel/kernel.tar.gz | grep -E 'header|headers' | tee work/reports/header-members.txt || true
            exit 1
          fi

          tar -xOzf work/kernel/kernel.tar.gz "${header_members[0]}" > work/kernel/headers.tar.gz
          gzip -t work/kernel/headers.tar.gz
          tar -xzf work/kernel/headers.tar.gz -C work/headers

          mapfile -t debs < <(find work/headers -type f -name '*.deb' -print)
          if [[ "${#debs[@]}" -gt 0 ]]; then
            mkdir -p work/headers/root
            for deb in "${debs[@]}"; do
              dpkg-deb -x "$deb" work/headers/root
            done
            header_root=work/headers/root
          else
            header_root=work/headers
          fi

          mapfile -t auto_conf < <(
            find -L "$header_root" -type f -path '*/include/config/auto.conf' -print
          )
          if [[ "${#auto_conf[@]}" -ne 1 ]]; then
            echo "::error::Could not identify exactly one prepared kernel build tree"
            find work/headers -maxdepth 5 -type f \( -name Makefile -o -name Module.symvers -o -name kernel.release \) -print | tee work/reports/header-layout.txt
            exit 1
          fi
          kdir="$(dirname "$(dirname "$(dirname "${auto_conf[0]}")")")"
          [[ -s "$kdir/Makefile" ]] || { echo "::error::Kernel Makefile missing at $kdir"; exit 1; }
          echo "$kdir" > work/reports/kernel-build-dir.txt

          curl --fail --location --retry 3 \
            "https://codeload.github.com/w568w/rknpu-module/tar.gz/${RKNPU_MODULE_COMMIT}" \
            -o work/rknpu-source.tar.gz
          mkdir -p work/rknpu/unpack
          tar -xzf work/rknpu-source.tar.gz --strip-components=1 -C work/rknpu/unpack

          {
            echo "Kernel package: ${KERNEL_PACKAGE_VERSION}"
            echo "Kernel package SHA256: ${KERNEL_PACKAGE_SHA256}"
            echo "Header member: ${header_members[0]}"
            echo "Kernel build tree: $kdir"
            echo "RKNPU repository: https://github.com/w568w/rknpu-module"
            echo "RKNPU commit: ${RKNPU_MODULE_COMMIT}"
            echo "RKNPU package version: 0.9.8"
            echo "Cross compiler: $(aarch64-none-linux-gnu-gcc --version | head -n1)"
            cat "$RUNNER_TEMP/arm-toolchain-version.txt"
            echo "Kernel release: $(cat "$kdir/include/config/kernel.release" 2>/dev/null || true)"
            echo "Module.symvers: $([[ -s "$kdir/Module.symvers" ]] && echo present || echo missing)"
          } | tee work/reports/build-inputs.txt

      - name: Build RKNPU module and device-tree overlay
        id: build
        shell: bash
        run: |
          set -uo pipefail
          kdir="$(cat work/reports/kernel-build-dir.txt)"
          src="$PWD/work/rknpu/unpack"
          kernel_source="$PWD/work/kernel-source"
          builddir="$PWD/work/kernel-build"
          mkdir -p work/reports
          cp -a "$kdir/." "$builddir/"
          echo "$builddir" > work/reports/kernel-build-dir-used.txt

          # Rebuild host-side Kbuild helpers: packaged binaries may target ARM64,
          # while this cross-build runs on an x86_64 GitHub-hosted runner.
          {
            echo "Before rebuild:"
            file "$builddir/scripts/basic/fixdep" "$builddir/scripts/mod/modpost" 2>&1 || true
          } | tee work/reports/host-tools-before.txt

          rm -f \
            "$builddir/scripts/basic/fixdep" \
            "$builddir/scripts/mod/modpost" \
            "$builddir/scripts/mod/mk_elfconfig" \
            "$builddir/scripts/genksyms/genksyms" \
            "$builddir/scripts/recordmcount"

          # The headers archive is a prepared output tree, not a full source
          # tree: helper dependencies such as scripts/gen-randstruct-seed.sh
          # are absent. Pair it with the matching 6.18.63 source checkout.
          set +e
          : > work/reports/host-tools-rebuild.log
          cp "$builddir/include/config/auto.conf" "$builddir/.config"
          make -C "$kernel_source" O="$builddir" ARCH=arm64 \
            CROSS_COMPILE=aarch64-none-linux-gnu- HOSTCC=gcc HOSTCXX=g++ \
            V=1 olddefconfig \
            2>&1 | tee -a work/reports/host-tools-rebuild.log
          helper_rc=${PIPESTATUS[0]}
          if [[ "$helper_rc" -eq 0 ]]; then
            make -C "$kernel_source" O="$builddir" ARCH=arm64 \
              CROSS_COMPILE=aarch64-none-linux-gnu- HOSTCC=gcc HOSTCXX=g++ \
              V=1 scripts \
              2>&1 | tee -a work/reports/host-tools-rebuild.log
            helper_rc=${PIPESTATUS[0]}
          fi
          if [[ "$helper_rc" -eq 0 ]]; then
            # The generic scripts target does not descend into scripts/mod.
            # Build that directory so Kbuild creates modpost, mk_elfconfig,
            # elfconfig.h and the generated device-table offsets together.
            make -C "$kernel_source" O="$builddir" ARCH=arm64 \
              CROSS_COMPILE=aarch64-none-linux-gnu- HOSTCC=gcc HOSTCXX=g++ \
              V=1 scripts/mod/ \
              2>&1 | tee -a work/reports/host-tools-rebuild.log
            helper_rc=${PIPESTATUS[0]}
          fi

          # Some Kbuild releases place hostprogs in the source tree even when
          # O= is supplied. The external-module modpost phase expects them in
          # the prepared output tree. Locate and stage only verified host ELF
          # tools; never copy target-architecture kernel objects here.
          if [[ "$helper_rc" -eq 0 ]]; then
            for helper in scripts/basic/fixdep scripts/mod/modpost; do
              if [[ ! -x "$builddir/$helper" && -x "$kernel_source/$helper" ]]; then
                mkdir -p "$(dirname "$builddir/$helper")"
                cp "$kernel_source/$helper" "$builddir/$helper"
              fi
              if [[ ! -x "$builddir/$helper" ]]; then
                echo "::error::Host helper missing from output tree: $helper"
                helper_rc=1
              else
                file "$builddir/$helper"
                readelf -h "$builddir/$helper" | grep -E 'Class:|Machine:'
              fi
            done
          fi
          host_tools_rc=$helper_rc
          echo "host_tools_rc=$host_tools_rc" >> "$GITHUB_OUTPUT"
          set -e

          {
            echo "After rebuild:"
            file "$builddir/scripts/basic/fixdep" "$builddir/scripts/mod/modpost" 2>&1 || true
            if [[ -x "$builddir/scripts/basic/fixdep" ]]; then
              readelf -h "$builddir/scripts/basic/fixdep" | grep -E 'Class:|Machine:'
            fi
            if [[ -x "$builddir/scripts/mod/modpost" ]]; then
              readelf -h "$builddir/scripts/mod/modpost" | grep -E 'Class:|Machine:'
            fi
          } | tee work/reports/host-tools-after.txt

          # First baseline: omit optional devfreq implementation. The pinned
          # module source includes a non-mainline governor header
          # (linux/devfreq-governor.h); its own rknpu_devfreq.h provides
          # no-op stubs when RKNPU_NO_DEVFREQ is defined. Keep this CI-only:
          # do not mutate the pinned upstream source or claim DVFS support.
          if [[ "$host_tools_rc" -eq 0 ]]; then
            cp "$src/Kbuild" work/reports/Kbuild.upstream
            sed -i 's@src/rknpu_debugger.o src/rknpu_devfreq.o@src/rknpu_debugger.o@' "$src/Kbuild"
            printf '\nccflags-y += -DRKNPU_NO_DEVFREQ\n' >> "$src/Kbuild"
            diff -u work/reports/Kbuild.upstream "$src/Kbuild" \
              > work/reports/Kbuild.devfreq-disabled.patch || true
            cat work/reports/Kbuild.devfreq-disabled.patch
          fi

          set +e
          if [[ "$host_tools_rc" -eq 0 ]]; then
            make -C "$kernel_source" O="$builddir" M="$src" ARCH=arm64 \
              CROSS_COMPILE=aarch64-none-linux-gnu- HOSTCC=gcc HOSTCXX=g++ V=1 modules \
              2>&1 | tee work/reports/module-build.log
            module_rc=${PIPESTATUS[0]}
          else
            module_rc=98
            echo "Skipping module build because host helper rebuild failed." \
              | tee work/reports/module-build.log
          fi
          echo "module_rc=$module_rc" >> "$GITHUB_OUTPUT"
          echo "host_tools_rc=$host_tools_rc" >> "$GITHUB_OUTPUT"
          set -e

          if [[ "$module_rc" -eq 0 ]]; then
            find "$src" -maxdepth 2 -type f -name 'rknpu.ko' -exec cp {} work/reports/ \;
            if [[ -s work/reports/rknpu.ko ]]; then
              modinfo work/reports/rknpu.ko > work/reports/module-modinfo.txt
              modinfo -F vermagic work/reports/rknpu.ko > work/reports/module-vermagic.txt
              modinfo -F depends work/reports/rknpu.ko > work/reports/module-depends.txt
            else
              echo "::warning::Build returned success but rknpu.ko was not found"
              module_rc=2
              echo "module_rc=$module_rc" >> "$GITHUB_OUTPUT"
            fi
          fi

          set +e
          cpp -nostdinc -I "$kdir/include" -undef -x assembler-with-cpp \
            "$src/dts/rk3566-rknpu-overlay.dts" \
            work/reports/rk3566-rknpu-overlay.preprocessed.dts \
            2>&1 | tee work/reports/overlay-cpp.log
          cpp_rc=${PIPESTATUS[0]}
          if [[ "$cpp_rc" -eq 0 ]]; then
            dtc -@ -I dts -O dtb \
              -o work/reports/rk3566-rknpu.dtbo \
              work/reports/rk3566-rknpu-overlay.preprocessed.dts \
              2>&1 | tee work/reports/overlay-dtc.log
            dtc_rc=${PIPESTATUS[0]}
          else
            dtc_rc=99
          fi
          set -e
          echo "overlay_cpp_rc=$cpp_rc" >> "$GITHUB_OUTPUT"
          echo "overlay_dtc_rc=$dtc_rc" >> "$GITHUB_OUTPUT"

          {
            echo "Host helper rebuild exit: $host_tools_rc"
            echo "RKNPU module build exit: $module_rc"
            echo "DT overlay CPP exit: $cpp_rc"
            echo "DT overlay DTC exit: $dtc_rc"
            echo
            echo "This is a compile-only test. No module was loaded and no device was modified."
          } | tee work/reports/result-summary.txt

      - name: Upload compile report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rknpu-6.18.63-cross-build-report
          path: |
            work/reports/
            work/rknpu-source.tar.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce compile result
        if: always()
        shell: bash
        env:
          MODULE_RC: ${{ steps.build.outputs.module_rc }}
          OVERLAY_CPP_RC: ${{ steps.build.outputs.overlay_cpp_rc }}
          OVERLAY_DTC_RC: ${{ steps.build.outputs.overlay_dtc_rc }}
        run: |
          set -euo pipefail
          [[ "${MODULE_RC:-99}" == "0" ]] || { echo "::error::RKNPU module build failed"; exit 1; }
          [[ "${OVERLAY_CPP_RC:-99}" == "0" ]] || { echo "::error::DT overlay preprocessing failed"; exit 1; }
          [[ "${OVERLAY_DTC_RC:-99}" == "0" ]] || { echo "::error::DT overlay compilation failed"; exit 1; }
