name: Inspect Ophub 6.18.63 kernel package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download and verify outer kernel archive
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.env
          mkdir -p inspection/inner

          outer="inspection/${KERNEL_PACKAGE_ASSET}"
          curl --fail --location --retry 3 --retry-delay 3 "${KERNEL_PACKAGE_URL}" -o "${outer}"

          actual="$(sha256sum "${outer}" | awk '{print $1}')"
          echo "Expected outer SHA256: ${KERNEL_PACKAGE_SHA256}"
          echo "Actual   outer SHA256: ${actual}"
          [[ "${actual}" == "${KERNEL_PACKAGE_SHA256}" ]] || {
            echo "::error::Outer kernel archive SHA-256 mismatch"
            exit 1
          }

          gzip -t "${outer}"
          tar -tzf "${outer}" > inspection/outer-archive-list.txt

          echo "Outer archive entries:"
          cat inspection/outer-archive-list.txt

          mapfile -t inner_members < <(grep -E '^6\.18\.63/[^/]+\.tar\.gz$' inspection/outer-archive-list.txt || true)
          if [[ "${#inner_members[@]}" -eq 0 ]]; then
            echo "::error::No nested kernel tar.gz packages found in outer archive"
            exit 1
          fi

          : > inspection/inner-archive-list.txt
          : > inspection/inner-package-checksums.txt
          for member in "${inner_members[@]}"; do
            name="${member##*/}"
            extracted="inspection/inner/${name}"
            listing="inspection/inner/${name}.list"

            echo "Extracting nested package: ${member}"
            tar -xOzf "${outer}" "${member}" > "${extracted}"
            gzip -t "${extracted}"
            sha256sum "${extracted}" >> inspection/inner-package-checksums.txt
            tar -tzf "${extracted}" > "${listing}"

            {
              echo "===== ${name} ====="
              cat "${listing}"
              echo
            } >> inspection/inner-archive-list.txt
          done

          {
            echo "Ophub kernel package inspection"
            echo "Kernel package: ${KERNEL_PACKAGE_VERSION}"
            echo "Outer archive SHA256: ${actual}"
            echo "Nested packages inspected: ${#inner_members[@]}"
            echo
            echo "Nested package integrity:"
            echo "All nested gzip streams passed gzip -t."
            echo
            echo "Target file discovery:"
            if grep -E '(^|/)rk3566-panther-x2\.dtb$' inspection/inner-archive-list.txt; then
              echo "Panther X2 DTB: FOUND"
            else
              echo "Panther X2 DTB: NOT FOUND"
            fi
            if grep -E '(^|/)(Image|Image\.gz|vmlinuz)(\.\w+)?$' inspection/inner-archive-list.txt; then
              echo "Kernel image candidate: FOUND"
            else
              echo "Kernel image candidate: NOT FOUND"
            fi
            if grep -E '(^|/)lib/modules/[^/]+/' inspection/inner-archive-list.txt; then
              echo "Kernel modules tree: FOUND"
            elif grep -E '(^|/)modules/[^/]+/' inspection/inner-archive-list.txt; then
              echo "Kernel modules tree: FOUND (modules-prefixed layout)"
            else
              echo "Kernel modules tree: NOT FOUND"
            fi
            echo
            echo "Nested package checksums:"
            cat inspection/inner-package-checksums.txt
          } | tee inspection/inspection-report.txt

          echo "Outer archive bytes: $(stat -c %s "${outer}")"
          echo "Nested package count: ${#inner_members[@]}"

      - name: Upload complete inspection results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ophub-kernel-6.18.63-deep-inspection
          path: |
            inspection/outer-archive-list.txt
            inspection/inner-archive-list.txt
            inspection/inner-package-checksums.txt
            inspection/inspection-report.txt
          if-no-files-found: error
          retention-days: 14
