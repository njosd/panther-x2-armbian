name: Audit Panther X2 JP-TvBox U-Boot proper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-jp-proper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository evidence
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install static inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y u-boot-tools device-tree-compiler binutils-aarch64-linux-gnu file python3

      - name: Verify exact JP-TvBox FIT identity
        shell: bash
        run: |
          set -euo pipefail
          src="docs/research-assets/bootloader/panther-x2/JP-TvBox-U-Boot/u-boot.itb"
          test -f "$src"
          mkdir -p audit-jp/input audit-jp/extracted audit-jp/report
          cp "$src" audit-jp/input/jp-tvbox-u-boot.itb
          blob_sha=$(git hash-object "$src")
          sha256=$(sha256sum "$src" | awk '{print $1}')
          size=$(stat -c '%s' "$src")
          {
            echo "Source: $src"
            echo "Git blob SHA-1: $blob_sha"
            echo "SHA-256: $sha256"
            echo "Size: $size bytes"
            echo "Expected SHA-256: a1ae35a8522e4353611042e62c3b7b7eaa7e4b6955bae5e5c4f8499500dbfdce"
            echo "Expected size: 1464832 bytes"
          } | tee audit-jp/report/input-identity.txt
          test "$sha256" = "a1ae35a8522e4353611042e62c3b7b7eaa7e4b6955bae5e5c4f8499500dbfdce"
          test "$size" = "1464832"

      - name: Inspect FIT and extract hash-verified payloads
        shell: bash
        run: |
          set -euo pipefail
          fit="audit-jp/input/jp-tvbox-u-boot.itb"
          {
            echo "===== FIT listing ====="
            dumpimage -l "$fit"
            echo
            echo "===== FIT strings ====="
            strings -a -t x "$fit" | grep -Ei 'autoload|bootp|dhcp|tftp|net_auto_load|vendor_storage|LAN_MAC|ethaddr|gmac|ethernet|fdt' || true
          } 2>&1 | tee audit-jp/report/fit-inspection.txt

          python3 - <<'PY'
          import hashlib, struct
          from pathlib import Path

          src = Path("audit-jp/input/jp-tvbox-u-boot.itb")
          out = Path("audit-jp/extracted")
          report = Path("audit-jp/report")
          blob = src.read_bytes()
          if len(blob) < 40:
              raise SystemExit("FIT too short")
          fields = struct.unpack(">10I", blob[:40])
          magic, total, off_struct, off_strings, _off_mem, _ver, _last, _boot, size_strings, size_struct = fields
          if magic != 0xd00dfeed or total > len(blob):
              raise SystemExit("Invalid FIT/FDT header")
          strings = blob[off_strings:off_strings + size_strings]
          def string_at(offset):
              end = strings.find(bytes([0]), offset)
              if end < 0:
                  raise ValueError("Invalid FDT string-table offset")
              return strings[offset:end].decode()
          nodes, stack = {}, []
          pos, struct_end = off_struct, off_struct + size_struct
          while pos < struct_end:
              token = struct.unpack_from(">I", blob, pos)[0]
              pos += 4
              if token == 1:
                  end = blob.find(bytes([0]), pos)
                  if end < 0: raise ValueError("Unterminated node")
                  stack.append(blob[pos:end].decode())
                  pos = (end + 4) & ~3
              elif token == 2:
                  if not stack: raise ValueError("Unbalanced end node")
                  stack.pop()
              elif token == 3:
                  length, nameoff = struct.unpack_from(">II", blob, pos)
                  pos += 8
                  name = string_at(nameoff)
                  value = blob[pos:pos + length]
                  if len(value) != length: raise ValueError("Truncated property")
                  pos = (pos + length + 3) & ~3
                  nodes.setdefault("/".join(stack), {})[name] = value
              elif token == 4:
                  continue
              elif token == 9:
                  break
              else:
                  raise ValueError(f"Unknown FDT token {token:#x}")
          data_base = (total + 0xff) & ~0xff
          lines = [f"FIT totalsize: 0x{total:x}", f"External data base: 0x{data_base:x}", ""]
          for path, props in nodes.items():
              if not path.startswith("/images/") or "data-size" not in props:
                  continue
              name = path.rsplit("/", 1)[-1]
              size = int.from_bytes(props["data-size"], "big")
              if "data-position" in props:
                  offset = int.from_bytes(props["data-position"], "big")
              elif "data-offset" in props:
                  offset = data_base + int.from_bytes(props["data-offset"], "big")
              else:
                  raise ValueError(f"{name}: no external data position/offset")
              if offset + size > len(blob): raise ValueError(f"{name}: out of bounds")
              data = blob[offset:offset + size]
              hp = nodes.get(path + "/hash", {})
              expected = hp.get("value", b"").hex()
              actual = hashlib.sha256(data).hexdigest()
              if not expected or actual != expected:
                  raise ValueError(f"{name}: SHA-256 mismatch expected={expected} actual={actual}")
              dest = out / ("u-boot-proper.bin" if name == "uboot" else f"{name}.bin")
              dest.write_bytes(data)
              typ = props.get("type", b"").rstrip(bytes([0])).decode(errors="replace")
              lines.append(f"{name}: type={typ} offset=0x{offset:x} size={size} sha256={actual} VERIFIED")
          if not (out / "u-boot-proper.bin").is_file():
              raise SystemExit("U-Boot proper payload not found")
          (report / "verified-payloads.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

          if test -f audit-jp/extracted/fdt.bin; then
            dtc -I dtb -O dts -o audit-jp/extracted/fdt.dts audit-jp/extracted/fdt.bin 2>audit-jp/extracted/fdt-warnings.txt
            grep -Ein -C 3 'model|compatible|ethernet|gmac|mac-address|local-mac-address|aliases' audit-jp/extracted/fdt.dts > audit-jp/report/fdt-relevant.txt || true
          fi

      - name: Analyze proper strings and disassemble AArch64 payload
        shell: bash
        run: |
          set -euo pipefail
          bin="audit-jp/extracted/u-boot-proper.bin"
          file "$bin" | tee audit-jp/report/proper-file.txt
          stat -c '%n %s bytes' "$bin" | tee -a audit-jp/report/proper-file.txt
          sha256sum "$bin" | tee -a audit-jp/report/proper-file.txt
          strings -a -t x "$bin" > audit-jp/report/proper-strings.txt
          grep -Ein -C 2 'autoload|bootp|dhcp|tftp|net_auto_load|netboot_common|vendor_storage|LAN_MAC|ethaddr|eth1addr|gmac|ethernet|PHY|MDIO' audit-jp/report/proper-strings.txt > audit-jp/report/network-and-mac-strings.txt || true
          aarch64-linux-gnu-objdump -D -b binary -m aarch64 --show-raw-insn "$bin" > audit-jp/report/proper-disassembly.txt
          {
            echo "Raw AArch64 binary disassembly; no ELF symbols or trusted function boundaries are available."
            echo "No load address is assumed unless independently established for this exact proper payload."
            echo "Strings are evidence of embedded text only, not proof of execution."
            echo "The static reference scan below is deliberately conservative and is not a complete decompiler or control-flow proof."
          } > audit-jp/report/analysis-limitations.txt

      - name: Scan direct ADR and ADRP plus ADD string references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path("audit-jp/report")
          strings = root / "proper-strings.txt"
          disasm = root / "proper-disassembly.txt"
          terms = re.compile(r"autoload|bootp|dhcp|tftp|net_auto_load|netboot_common|vendor_storage|LAN_MAC|ethaddr|eth1addr|gmac|ethernet|PHY|MDIO", re.I)
          targets = []
          for line in strings.read_text(errors="replace").splitlines():
              m = re.match(r"\s*([0-9a-fA-F]+)\s+(.*)", line)
              if m and terms.search(m.group(2)):
                  targets.append((int(m.group(1), 16), m.group(2)))
          lines = disasm.read_text(errors="replace").splitlines()
          hits = []
          adr = re.compile(r"^\s*([0-9a-f]+):.*?\badr\s+(x\d+),\s*#?(0x[0-9a-f]+)", re.I)
          adrp = re.compile(r"^\s*([0-9a-f]+):.*?\badrp\s+(x\d+),\s*#?(0x[0-9a-f]+)", re.I)
          add = re.compile(r"^\s*([0-9a-f]+):.*?\badd\s+(x\d+),\s*(x\d+),\s*#(0x[0-9a-f]+|[0-9]+)", re.I)
          for i, line in enumerate(lines):
              m = adr.search(line)
              if m:
                  pc, dst = int(m.group(1),16), int(m.group(3),16)
                  for target, label in targets:
                      if dst == target: hits.append((i, pc, target, label, "ADR"))
              m = adrp.search(line)
              if not m: continue
              pc, reg, page = int(m.group(1),16), m.group(2), int(m.group(3),16)
              for j in range(i+1, min(i+9, len(lines))):
                  a = add.search(lines[j])
                  if a and a.group(2) == reg and a.group(3) == reg:
                      dest = page + int(a.group(4), 0)
                      for target, label in targets:
                          if dest == target: hits.append((i, pc, target, label, "ADRP+ADD"))
                      break
                  if re.search(rf"\b{reg}\b", lines[j]) and not re.search(r"\b(?:add|nop)\b", lines[j]):
                      break
          out = root / "string-reference-scan.txt"
          with out.open("w") as f:
              f.write("Conservative direct-reference scan; zero hits do not prove strings unused.\n")
              f.write(f"Indexed relevant strings: {len(targets)}\nMatches: {len(hits)}\n\n")
              for idx, pc, target, label, kind in hits:
                  f.write(f"{kind} code=0x{pc:x} string-file-offset=0x{target:x} text={label}\n")
                  for k in range(max(0,idx-10), min(len(lines),idx+16)): f.write(lines[k]+"\n")
                  f.write("\n")
          print(out.read_text())
          PY

      - name: Upload JP-TvBox static audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panther-x2-jp-tvbox-uboot-static-audit
          path: audit-jp/
          if-no-files-found: warn
          retention-days: 30
