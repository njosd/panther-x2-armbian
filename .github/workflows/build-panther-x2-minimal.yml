name: Build Panther X2 minimal bootable image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout project build manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Load pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.env
          {
            echo "OPHUB_ARMBIAN_REPO=$OPHUB_ARMBIAN_REPO"
            echo "OPHUB_ARMBIAN_COMMIT=$OPHUB_ARMBIAN_COMMIT"
            echo "ARMBIAN_BUILD_REPO=$ARMBIAN_BUILD_REPO"
            echo "ARMBIAN_BUILD_COMMIT=$ARMBIAN_BUILD_COMMIT"
            echo "OPHUB_RK35XX_KERNEL_SOURCE_COMMIT=$OPHUB_RK35XX_KERNEL_SOURCE_COMMIT"
            echo "OPHUB_UBOOT_REPO=$OPHUB_UBOOT_REPO"
            echo "OPHUB_UBOOT_COMMIT=$OPHUB_UBOOT_COMMIT"
            echo "OPHUB_FIRMWARE_REPO=$OPHUB_FIRMWARE_REPO"
            echo "OPHUB_FIRMWARE_COMMIT=$OPHUB_FIRMWARE_COMMIT"
            echo "OPHUB_RK35XX_PACKAGE_URL=$OPHUB_RK35XX_PACKAGE_URL"
            echo "OPHUB_RK35XX_PACKAGE_SHA256=$OPHUB_RK35XX_PACKAGE_SHA256"
            echo "OPHUB_RK35XX_KERNEL_VERSION=$OPHUB_RK35XX_KERNEL_VERSION"
            echo "TARGET_BUILD_BASE_BOARD=$TARGET_BUILD_BASE_BOARD"
            echo "TARGET_KERNEL_TAG=$TARGET_KERNEL_TAG"
            echo "TARGET_ROOTFS_SIZE_MIB=$TARGET_ROOTFS_SIZE_MIB"
            echo "TARGET_ROOTFS=$TARGET_ROOTFS"
          } >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo apt-get install -y \
            acl aria2 bc binfmt-support bison build-essential ca-certificates \
            ccache cpio curl device-tree-compiler dosfstools dwarves e2fsprogs \
            fdisk flex gawk gcc-aarch64-linux-gnu gdisk git gnupg gpg-agent \
            kmod libelf-dev libncurses-dev libssl-dev lz4 lzop make \
            parted pigz python3 python3-dev python3-pip qemu-user-static \
            rsync systemd-container tar u-boot-tools unzip uuid-dev wget xfsprogs \
            zstd

      - name: Fetch fixed Ophub, Armbian, U-Boot and firmware sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          git clone --filter=blob:none "$OPHUB_ARMBIAN_REPO" work/ophub
          git -C work/ophub checkout --detach "$OPHUB_ARMBIAN_COMMIT"
          git clone --filter=blob:none "$ARMBIAN_BUILD_REPO" work/ophub/build
          git -C work/ophub/build checkout --detach "$ARMBIAN_BUILD_COMMIT"

          git clone --filter=blob:none "$OPHUB_UBOOT_REPO" work/uboot
          git -C work/uboot checkout --detach "$OPHUB_UBOOT_COMMIT"
          test -s work/uboot/u-boot/rockchip/panther-x2/idbloader.img
          test -s work/uboot/u-boot/rockchip/panther-x2/u-boot.itb
          mkdir -p work/ophub/build-armbian/u-boot
          cp -a work/uboot/u-boot/. work/ophub/build-armbian/u-boot/

          git clone --filter=blob:none "$OPHUB_FIRMWARE_REPO" work/firmware
          git -C work/firmware checkout --detach "$OPHUB_FIRMWARE_COMMIT"
          test -d work/firmware/firmware
          mkdir -p work/ophub/build-armbian/armbian-files/common-files/usr/lib
          cp -a work/firmware/firmware work/ophub/build-armbian/armbian-files/common-files/usr/lib/

          echo "Pinned Ophub: $(git -C work/ophub rev-parse HEAD)"
          echo "Pinned Armbian: $(git -C work/ophub/build rev-parse HEAD)"
          echo "Pinned U-Boot: $(git -C work/uboot rev-parse HEAD)"
          echo "Pinned firmware: $(git -C work/firmware rev-parse HEAD)"

      - name: Disable upstream moving-branch dependency downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rebuild = Path("work/ophub/rebuild")
          source = rebuild.read_text()
          replacements = {
              'if [[ -n "${uboot_num}" && "${uboot_num}" -le "5" ]]; then':
                  'if false; then # CI pre-seeds U-Boot from the pinned commit',
              'if [[ -n "${firmware_num}" && "${firmware_num}" -le "5" ]]; then':
                  'if false; then # CI pre-seeds firmware from the pinned commit',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}")
              source = source.replace(old, new)

          marker = "\n".join([
              "    # Enable ssh service",
              '    ssh_config="etc/ssh/sshd_config"',
          ])
          injected = "\n".join([
              "    # Enable required first-boot network and remote-management services.",
              '    systemctl --root="${tag_rootfs}" enable ssh.service',
              '    systemctl --root="${tag_rootfs}" enable NetworkManager.service',
              '    systemctl --root="${tag_rootfs}" enable armbian-firstrun.service',
              "",
              "    # Enable ssh service",
              '    ssh_config="etc/ssh/sshd_config"',
          ])
          if source.count(marker) != 1:
              raise SystemExit("Expected SSH rootfs configuration marker exactly once")
          rebuild.write_text(source.replace(marker, injected))

          helper = Path("work/ophub/compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh")
          source = helper.read_text()
          old = "\n".join([
              '        git clone -q --depth 1 --filter=blob:none --sparse https://github.com/ophub/firmware "${edid_tmp}/fw" 2>/dev/null',
              '        git -C "${edid_tmp}/fw" sparse-checkout set firmware/edid >/dev/null 2>&1',
          ])
          new = "\n".join([
              '        mkdir -p "${edid_tmp}/fw/firmware/edid"',
              '        cp -af "${current_path}/../firmware/firmware/edid/." "${edid_tmp}/fw/firmware/edid/"',
          ])
          if source.count(old) != 1:
              raise SystemExit("Expected EDID moving-branch download block exactly once")
          helper.write_text(source.replace(old, new))
          print("Patched local build scripts to consume pinned U-Boot/firmware sources")
          PY

      - name: Pin Panther X2 model database to RK35xx 6.12.y
        shell: bash
        run: |
          set -euo pipefail
          db=work/ophub/build-armbian/armbian-files/common-files/etc/model_database.conf
          test -s "$db"
          python3 - "$db" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          lines = p.read_text().splitlines()
          found = 0
          out = []
          for line in lines:
              if line.startswith("r301") and ":panther-x2" in line:
                  fields = line.split(":")
                  if len(fields) < 15:
                      raise SystemExit("Panther X2 model database row has unexpected format")
                  fields[8] = "rk35xx/6.12.y"
                  line = ":".join(fields)
                  found += 1
              out.append(line)
          if found != 1:
              raise SystemExit(f"Expected exactly one Panther X2 row, found {found}")
          p.write_text("\n".join(out) + "\n")
          print("Panther X2 kernel selector: rk35xx/6.12.y")
          PY

      - name: Download and inspect exact RK35xx 6.12.81 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/kernel/rk35xx
          archive=work/kernel/6.12.81.tar.gz
          curl --fail --location --retry 4 --retry-delay 3 "$OPHUB_RK35XX_PACKAGE_URL" -o "$archive"
          echo "$OPHUB_RK35XX_PACKAGE_SHA256  $archive" | sha256sum --check
          gzip -t "$archive"
          mkdir -p work/ophub/build-armbian/kernel/rk35xx
          tar -xzf "$archive" -C work/ophub/build-armbian/kernel/rk35xx
          package_dir="work/ophub/build-armbian/kernel/rk35xx/$OPHUB_RK35XX_KERNEL_VERSION"
          test -d "$package_dir"
          cd "$package_dir"
          test -s sha256sums
          sha256sum --check sha256sums

          echo "========== PACKAGE TOP-LEVEL INVENTORY =========="
          find . -maxdepth 2 -type f -printf '%P | %s bytes\n' | sort
          echo "========== ARCHIVE METADATA =========="
          for kind in boot dtb-rockchip modules header; do
            file="$kind-$OPHUB_RK35XX_KERNEL_VERSION-rk35xx-ophub.tar.gz"
            if test -s "$file"; then
              echo "--- $file ---"
              stat -c 'size=%s bytes' "$file"
              gzip -t "$file"
              tar -tzf "$file" > "$kind.list"
              echo "entries=$(wc -l < "$kind.list")"
              echo "first 80 entries:"
              sed -n '1,80p' "$kind.list"
            else
              echo "::error::Expected archive is missing: $file"
              exit 1
            fi
          done

          echo "========== RELEVANT PATH CANDIDATES =========="
          for list in boot.list dtb-rockchip.list modules.list header.list; do
            echo "--- $list ---"
            grep -Ei '(^|/)(Image|Image-[^/]+|vmlinuz[^/]*|rk3566-panther-x2\\.dtb|[^/]*panther[^/]*\\.dtb|[^/]*6\\.12\\.81[^/]*)($|/)' "$list" || true
          done
          echo "========== PACKAGE INSPECTION COMPLETE =========="

      - name: Build pinned Armbian Noble base image
        shell: bash
        working-directory: work/ophub/build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          ./compile.sh RELEASE=noble BOARD=$TARGET_BUILD_BASE_BOARD BRANCH=current \
            BUILD_MINIMAL=no BUILD_ONLY=default HOST=armbian \
            BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha SHARE_LOG=yes

      - name: Prepare base rootfs and enable initial SSH access
        shell: bash
        working-directory: work/ophub
        run: |
          set -euo pipefail
          chmod +x compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh
          compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh \
            -v "$TARGET_ROOTFS" -s true -c true -k false -p arm64
          image=$(find build/output/images -maxdepth 1 -type f -name '*-trunk_*.img.gz' -print -quit)
          test -n "$image"
          gzip -dk "$image"
          test -s "${image%.gz}"

      - name: Rebuild Panther X2 image with pinned RK35xx kernel and loader
        shell: bash
        working-directory: work/ophub
        run: |
          set -euo pipefail
          sudo ./rebuild -b panther-x2 -r ophub/kernel -u "$TARGET_KERNEL_TAG" \
            -k "$OPHUB_RK35XX_KERNEL_VERSION" -a false -t ext4 -s "$TARGET_ROOTFS_SIZE_MIB" -n Panther-X2-Minimal

      - name: Validate final image contents
        shell: bash
        working-directory: work/ophub
        run: |
          set -euo pipefail
          check() {
            local label="$1"; shift
            echo "::group::CHECK $label"
            if "$@"; then
              echo "PASS: $label"
            else
              local rc=$?
              echo "::error::FAIL: $label (exit $rc)"
              echo "::endgroup::"
              return "$rc"
            fi
            echo "::endgroup::"
          }

          image=$(find build/output/images -maxdepth 1 -type f -name 'Armbian_*_rockchip_panther-x2_noble_6.12.81_server_*.img.gz' -print -quit)
          check "final compressed image exists" test -n "$image"
          sha256sum "$image" > "$image.sha256"
          check "final image gzip integrity" gzip -t "$image"
          mkdir -p validation
          gzip -dc "$image" > validation/panther-x2-minimal.img
          loop=$(sudo losetup --find --show --partscan validation/panther-x2-minimal.img)
          cleanup() {
            sudo umount validation/boot validation/root 2>/dev/null || true
            sudo losetup -d "$loop" 2>/dev/null || true
          }
          trap cleanup EXIT
          mkdir -p validation/boot validation/root
          sudo mount "${loop}p1" validation/boot
          sudo mount "${loop}p2" validation/root

          echo "========== BOOT PARTITION INVENTORY =========="
          sudo find validation/boot -maxdepth 4 -printf '%y %P -> %l (%s bytes)\n' | sort
          echo "========== ROOTFS KERNEL INVENTORY =========="
          sudo find validation/root/boot validation/root/usr/lib/modules -maxdepth 3 -printf '%y %P -> %l (%s bytes)\n' 2>/dev/null | sort || true
          echo "========== KERNEL PACKAGE STATE =========="
          sudo grep -E '^(Package|Version): (linux-image|linux-dtb|linux-u-boot)' validation/root/var/lib/dpkg/status || true
          echo "========== NETWORK SERVICE STATE =========="
          sudo find validation/root/etc/systemd/system -maxdepth 4 \( -iname '*network*manager*' -o -iname '*NetworkManager*' \) -printf '%y %p -> %l\n' 2>/dev/null | sort || true
          sudo systemctl --root="$PWD/validation/root" is-enabled NetworkManager.service 2>&1 || true
          sudo systemctl --root="$PWD/validation/root" is-enabled NetworkManager 2>&1 || true
          echo "========== NETWORK UNIT CONTENT =========="
          sudo sed -n '1,220p' validation/root/usr/lib/systemd/system/NetworkManager.service 2>/dev/null || true
          echo "========== NETPLAN CONTENT =========="
          sudo find validation/root/etc/netplan -maxdepth 2 -type f -print -exec sed -n '1,220p' {} \; 2>/dev/null || true
          echo "========== NETWORKMANAGER CONFIG =========="
          sudo find validation/root/etc/NetworkManager -maxdepth 3 -type f -print -exec sed -n '1,160p' {} \; 2>/dev/null || true
          echo "========== OTHER NETWORK CONFIG =========="
          sudo find validation/root/etc/systemd/network validation/root/etc/network -maxdepth 3 -type f -print -exec sed -n '1,160p' {} \; 2>/dev/null || true
          echo "========== KERNEL PACKAGE STATUS DETAILS =========="
          sudo dpkg-query --admindir=validation/root/var/lib/dpkg -W -f='${binary:Package} ${Version} ${db:Status-Abbrev} ${Status}\n' 'linux-image*' 'linux-dtb*' 'linux-u-boot*' 2>&1 || true
          for package in linux-image-current-meson64 linux-dtb-current-meson64 linux-u-boot-odroidn2-current; do
            echo "--- $package ---"
            sudo dpkg-query --admindir=validation/root/var/lib/dpkg -L "$package" 2>&1 | sed -n '1,100p' || true
          done

          check "boot Image symlink/file" test -s validation/boot/Image
          check "versioned kernel image" test -s validation/boot/vmlinuz-6.12.81-rk35xx-ophub
          check "versioned initrd" test -s validation/boot/uInitrd-6.12.81-rk35xx-ophub
          check "Panther X2 DTB" test -s validation/boot/dtb/rockchip/rk3566-panther-x2.dtb
          check "armbianEnv selects Panther X2 DTB" grep -q 'rk3566-panther-x2.dtb' validation/boot/armbianEnv.txt

          idb_size=$(stat -c '%s' build-armbian/u-boot/rockchip/panther-x2/idbloader.img)
          idb_blocks=$(((idb_size + 511) / 512))
          dd if=validation/panther-x2-minimal.img of=validation/idbloader.from-image bs=512 skip=64 count="$idb_blocks" status=none
          truncate -s "$idb_size" validation/idbloader.from-image
          check "embedded idbloader matches pinned source" cmp validation/idbloader.from-image build-armbian/u-boot/rockchip/panther-x2/idbloader.img

          itb_size=$(stat -c '%s' build-armbian/u-boot/rockchip/panther-x2/u-boot.itb)
          itb_blocks=$(((itb_size + 511) / 512))
          dd if=validation/panther-x2-minimal.img of=validation/u-boot.itb.from-image bs=512 skip=16384 count="$itb_blocks" status=none
          truncate -s "$itb_size" validation/u-boot.itb.from-image
          check "embedded u-boot.itb matches pinned source" cmp validation/u-boot.itb.from-image build-armbian/u-boot/rockchip/panther-x2/u-boot.itb

          check "SSH server config exists" test -s validation/root/etc/ssh/sshd_config
          check "shadow database exists" test -s validation/root/etc/shadow
          check "6.12.81 modules directory exists" test -d validation/root/usr/lib/modules/6.12.81-rk35xx-ophub
          check "SSH listens on port 22" grep -q '^Port 22' validation/root/etc/ssh/sshd_config
          check "root SSH login enabled" grep -q '^PermitRootLogin yes' validation/root/etc/ssh/sshd_config
          check "password SSH authentication enabled" grep -q '^PasswordAuthentication yes' validation/root/etc/ssh/sshd_config
          check "root password hash exists" sudo awk -F: '$1=="root" && $2!="" {found=1} END {exit !found}' validation/root/etc/shadow
          check "SSH service unit exists" test -e validation/root/usr/lib/systemd/system/ssh.service
          check "SSH service enabled" test -e validation/root/etc/systemd/system/multi-user.target.wants/ssh.service
          check "NetworkManager service unit exists" test -e validation/root/usr/lib/systemd/system/NetworkManager.service
          check "NetworkManager service enabled" sudo systemctl --root="$PWD/validation/root" is-enabled NetworkManager.service
          check "Armbian first-run service exists" test -e validation/root/usr/lib/systemd/system/armbian-firstrun.service
          check "Armbian first-run service enabled" test -e validation/root/etc/systemd/system/multi-user.target.wants/armbian-firstrun.service
          check "first-login marker exists" test -e validation/root/root/.not_logged_in_yet
          check "Armbian first-login program executable" test -x validation/root/usr/lib/armbian/armbian-firstlogin
          check "first-run defaults exist" test -s validation/root/etc/default/armbian-firstrun
          check "first-run regenerates SSH host keys" grep -q '^OPENSSHD_REGENERATE_HOST_KEYS=true' validation/root/etc/default/armbian-firstrun
          check "openssh-server package installed" grep -q '^Package: openssh-server$' validation/root/var/lib/dpkg/status
          check "network-manager package installed" grep -q '^Package: network-manager$' validation/root/var/lib/dpkg/status
          check "netplan package installed" grep -q '^Package: netplan.io$' validation/root/var/lib/dpkg/status
          check "Netplan directory exists" test -d validation/root/etc/netplan
          check "Netplan YAML exists" bash -c 'find validation/root/etc/netplan -maxdepth 1 -type f -name "*.yaml" | grep -q .'
          check "Netplan uses NetworkManager renderer" grep -R -Eq 'renderer:[[:space:]]*NetworkManager' validation/root/etc/netplan
          check "Netplan enables DHCPv4" grep -R -Eq 'dhcp4:[[:space:]]*true' validation/root/etc/netplan
          check "rootfs U-Boot idbloader copy exists" test -s validation/root/usr/lib/u-boot/idbloader.img
          check "rootfs U-Boot FIT copy exists" test -s validation/root/usr/lib/u-boot/u-boot.itb

          {
            echo "Image: $image"
            sha256sum "$image"
            echo "Kernel: 6.12.81-rk35xx-ophub"
            echo "DTB: rk3566-panther-x2.dtb"
            echo "Bootloader: idbloader.img + u-boot.itb"
            echo "SSH: root/password configured; TCP/22"
            echo "First login marker: present"
            echo "NetworkManager service unit: present"
          } | tee validation/validation-report.txt
          sudo umount validation/boot validation/root
          sudo losetup -d "$loop"
          trap - EXIT

          cp validation/validation-report.txt build/output/images/

      - name: Upload bootable image and validation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: panther-x2-minimal-6.12.81-noble
          path: |
            work/ophub/build/output/images/Armbian_*_rockchip_panther-x2_noble_6.12.81_server_*.img.gz
            work/ophub/build/output/images/Armbian_*_rockchip_panther-x2_noble_6.12.81_server_*.img.gz.sha256
            work/ophub/build/output/images/validation-report.txt
          if-no-files-found: error
          retention-days: 14
