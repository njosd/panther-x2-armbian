name: Privacy-safe Git history rewrite

on:
  workflow_dispatch:
    inputs:
      confirm_rewrite:
        description: "Type REWRITE-PUBLIC-HISTORY to confirm the authorized force-push"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: privacy-history-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    if: ${{ inputs.confirm_rewrite == 'REWRITE-PUBLIC-HISTORY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install git-filter-repo
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3
          python3 -m pip install --user --break-system-packages git-filter-repo

      - name: Mirror clone all published branches and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "Initial branch refs:"
          git for-each-ref --format='%(refname) %(objectname)' refs/heads/

      - name: Rewrite sensitive historical content and remove raw evidence
        run: |
          set -euo pipefail
          cd repo.git
          cat > /tmp/privacy-replacements.txt <<'EOF'
          regex:(?i)([0-9a-f]{2}:){5}[0-9a-f]{2}==>[REDACTED-MAC]
          regex:192\.168\.(9|3|1)\.[0-9]{1,3}==>192.168.x.x
          regex:10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}==>10.x.x.x
          regex:172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}==>172.16.x.x
          regex:4433a81e51158739==>[REDACTED-CPU-SERIAL]
          regex:638141e4baaa==>[REDACTED-BUILD-HOST-ID]
          regex:root@fv-az[0-9]+-[0-9]+==>root@[REDACTED-BUILD-HOST]
          regex:/Users/[^/[:space:]]+==>/Users/[REDACTED-USER]
          regex:/home/[^/[:space:]]+==>/home/[REDACTED-USER]
          regex:[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}==>[REDACTED-EMAIL]
          9c7ff1a4-9beb-4346-b396-cdd1d4d1feea==>[REDACTED-UUID]
          57ba8610-bc1c-4f13-9ce4-c864b229d25e==>[REDACTED-UUID]
          55586ba5-0259-40c3-a67a-30e92526320b==>[REDACTED-UUID]
          0387b7f9-f90e-4c1c-b00e-b8fec2c6cb9c==>[REDACTED-UUID]
          f705ecc6-6a2b-4a16-9ccb-d62a59d92001==>[REDACTED-UUID]
          EOF
          git filter-repo --force --replace-text /tmp/privacy-replacements.txt \
            --invert-paths \
            --path evidence/uart/panther-emmc-uart-bidirectional-20261113.txt.gz \
            --path evidence/uart/panther-tf-6.12.81-uart-20261116-strings.txt \
            --path-glob 'evidence/uart/part-*.b64' \
            --path evidence/uart/panther-jp-tvbox-u-boot-boot-20261117.txt \
            --path evidence/boot/2026-11-19-panther-x2-jp-idbloader-uart.log \
            --path evidence/network/2026-11-19-panther-x2-dhcp-ipv4-status.txt \
            --path-glob 'evidence/hardware/*.tar.gz'
          git reflog expire --expire=now --all
          git gc --prune=now

      - name: Verify rewritten reachable history before publishing
        run: |
          set -euo pipefail
          cd repo.git
          python3 - <<'PY'
          import re, subprocess, sys
          objects = subprocess.check_output(["git","rev-list","--objects","--all"], text=True).splitlines()
          shas = list(dict.fromkeys(line.split()[0] for line in objects))
          proc = subprocess.Popen(["git","cat-file","--batch"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          bad = []
          patterns = [
            ("MAC", re.compile(rb"(?i)(?<![0-9a-f])(?:[0-9a-f]{2}:){5}[0-9a-f]{2}(?![0-9a-f])")),
            ("UUID", re.compile(rb"(?i)\b(?:9c7ff1a4-9beb-4346-b396-cdd1d4d1feea|57ba8610-bc1c-4f13-9ce4-c864b229d25e|55586ba5-0259-40c3-a67a-30e92526320b|0387b7f9-f90e-4c1c-b00e-b8fec2c6cb9c|f705ecc6-6a2b-4a16-9ccb-d62a59d92001)\b")),
            ("CPU_SERIAL", re.compile(rb"4433a81e51158739")),
            ("PRIVATE_LAN", re.compile(rb"192\.168\.(?:9|3|1)\.[0-9]{1,3}")),
          ]
          for sha in shas:
            proc.stdin.write((sha+"\n").encode()); proc.stdin.flush()
            header = proc.stdout.readline()
            if not header:
              raise RuntimeError("git cat-file returned no header")
            parts = header.split()
            if len(parts) < 3 or parts[1] != b"blob":
              continue
            size = int(parts[2]); data = proc.stdout.read(size); proc.stdout.read(1)
            for label, pattern in patterns:
              if pattern.search(data):
                bad.append((sha,label))
                break
          proc.stdin.close(); proc.wait()
          if bad:
            print("Privacy verification failed; no push performed. Finding counts:", len(bad))
            for item in bad[:30]: print(item[0], item[1])
            sys.exit(1)
          print("Verified reachable blob count:", len(shas))
          print("No targeted MAC, UUID, CPU serial, or private LAN identifiers found.")
          PY

      - name: Force-update all branch and tag refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd repo.git
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin --all
          git push --force origin --tags
          echo "Published branch refs:"
          git ls-remote --heads origin

      - name: Publish completion summary
        run: |
          {
            echo "## Privacy history rewrite"
            echo "- All published branch histories were rewritten."
            echo "- Raw UART and unreviewed hardware tar archives were removed from reachable history."
            echo "- Targeted text identifiers were redacted and reachable blobs were scanned before push."
            echo "- GitHub-managed refs/pull/*, caches, forks, clones and workflow artifacts are outside this branch/tag push and may require separate cleanup."
          } >> "$GITHUB_STEP_SUMMARY"
