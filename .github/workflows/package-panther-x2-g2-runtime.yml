            echo "kernel_config_sha256=$G2_CONFIG_SHA256"
            echo "kernel_image_sha256=$G2_IMAGE_SHA256"
            echo "dtb_sha256=$G2_DTB_SHA256"
            echo "busybox_version=1.37.0 (reused frozen B1 static binary)"
            echo "busybox_sha256=$B1_BUSYBOX_SHA256"
            echo "u_boot_proper_sha256=$JP_UBOOT_SHA256"
            echo "rk809_mfd_builtin=yes; rk809_dtb_status=disabled; pmic_probe=not_performed"
            echo "gmac1=disabled; mdio=disabled; rtl8211f=disabled; physical_tx=not_performed"
            echo "network_core=enabled; AF_PACKET=enabled; no physical netdev expected"
            echo "storage_usb=BLOCK/MMC/USB support retained per B1 baseline; DTB node statuses audited; /init does not mount or write persistent storage"
            echo "usb_network_adapters=disabled; USB external NICs excluded"
            echo "rootfs=RAM initramfs; no persistent rootfs"
            echo "bootargs=console=ttyS02,1500000 earlycon loglevel=8 ignore_loglevel printk.time=1 rdinit=/init"
            echo "load_addresses=Image:0x00280000;uInitrd:0x0a200000;DTB:0x0a100000"
            echo "uboot_proper_location=raw LBA 16384 (8 MiB)"
            echo "partition=GPT PANTHER_BOOT ext4; start LBA 32768; end LBA 4192255"
            echo "boot_chain=existing eMMC SPL -> TF JP-TvBox U-Boot proper -> TF Image/uInitrd/DTB -> RAM initramfs"
            echo "hardware_access=none"
            echo "physical_media_writes=none"
            echo "boot_authorization=not_granted"
            echo "g2_build_manifest_sha256=$(sha256sum work/output/G2-BUILD-MANIFEST.txt | awk '{print $1}')"
            echo "g2_dtb_isolation_sha256=$(sha256sum work/output/G2-DTB-ISOLATION.txt | awk '{print $1}')"
            echo "init_sha256=$(sha256sum work/output/init | awk '{print $1}')"
            echo "boot_cmd_sha256=$(sha256sum work/output/boot.cmd | awk '{print $1}')"
            cat work/output/tf-image-sha256.txt
          } | tee work/output/RUNTIME-MANIFEST.txt

          (
            cd work/output
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          (cd work/output && sha256sum --check SHA256SUMS)

      - name: Upload Project-A G2 runtime (PREPARE-ONLY)
        uses: actions/upload-artifact@v6
        with:
          name: panther-x2-project-a-g2-runtime-PREPARE-ONLY
          path: |
            work/output/
            work/boot/
            work/debug/
            work/logs-kernel-image.txt
          if-no-files-found: error
          retention-days: 30
