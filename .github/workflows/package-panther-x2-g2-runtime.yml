      - name: Build minimal RAM initramfs with the frozen static BusyBox
        run: |
          set -euo pipefail
          ROOT=work/initramfs
          mkdir -p "$ROOT"/{bin,dev,proc,sys,run,etc,sbin}
          install -m 0755 "$ROOT/busybox" "$ROOT/bin/busybox"
          rm "$ROOT/busybox"
          for applet in ash sh mount mkdir cat uname printf dmesg tail echo ls test; do
            qemu-aarch64-static "$ROOT/bin/busybox" --list | grep -qx "$applet"
            ln -s busybox "$ROOT/bin/$applet"
          done
          install -m 0755 scripts/panther-x2-g2-runtime/init "$ROOT/init"
          qemu-aarch64-static "$ROOT/bin/busybox" ash -n "$ROOT/init"
          cp scripts/panther-x2-g2-runtime/init work/output/init
          cp scripts/panther-x2-g2-runtime/boot.cmd work/output/boot.cmd
          (
            cd "$ROOT"
            find . -print0 | sort -z | cpio --null -o --format=newc
          ) | gzip -n -9 > work/output/initramfs.cpio.gz
          mkimage -A arm64 -O linux -T ramdisk -C gzip \
            -n "Panther X2 Project-A G2 minimal RAM runtime" \
            -d work/output/initramfs.cpio.gz work/boot/uInitrd
          mkimage -l work/boot/uInitrd | tee work/output/uinitrd-header.txt
          grep -qi AArch64 work/output/uinitrd-header.txt

          mkdir -p work/initramfs-check
          gzip -dc work/output/initramfs.cpio.gz | (cd work/initramfs-check && cpio -idm --quiet)
          cmp scripts/panther-x2-g2-runtime/init work/initramfs-check/init
          cmp work/initramfs/busybox work/initramfs-check/bin/busybox
          test -x work/initramfs-check/init
          test -x work/initramfs-check/bin/busybox
          sha256sum work/output/initramfs.cpio.gz work/boot/uInitrd | tee work/output/initramfs-sha256.txt

      - name: Generate frozen U-Boot script and hybrid TF image (runner only)
