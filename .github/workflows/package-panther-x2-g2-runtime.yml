          sudo umount work/tf-mnt
          sudo losetup -d "$LOOP"
          trap - EXIT

          sha256sum "$IMAGE" | tee work/output/tf-image-sha256.txt
          zstd -T0 -10 "$IMAGE" -o "${IMAGE}.zst"
