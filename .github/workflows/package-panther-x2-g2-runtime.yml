            -d work/output/boot.cmd work/boot/boot.scr
          mkimage -l work/boot/boot.scr | tee work/output/bootscr-header.txt

          IMAGE=work/output/panther-x2-project-a-g2-runtime-PREPARE-ONLY.img
          truncate -s 2G "$IMAGE"
          sgdisk --clear --new=1:32768:4192255 --typecode=1:8300 \
            --change-name=1:PANTHER_BOOT "$IMAGE"
          LOOP="$(sudo losetup --find --show --partscan "$IMAGE")"
          cleanup() {
            sudo umount work/tf-mnt 2>/dev/null || true
            sudo losetup -d "$LOOP" 2>/dev/null || true
          }
          mkdir -p work/tf-mnt
          trap cleanup EXIT
          sudo partprobe "$LOOP"
          sleep 2
          PART="${LOOP}p1"
          test -b "$PART"
          sudo mkfs.ext4 -F -L PANTHER_BOOT "$PART"
          sudo mount "$PART" work/tf-mnt
          sudo install -m 0644 work/boot/Image work/tf-mnt/Image
          sudo install -m 0644 work/boot/uInitrd work/tf-mnt/uInitrd
          sudo install -m 0644 work/boot/boot.scr work/tf-mnt/boot.scr
          sudo install -m 0644 work/output/boot.cmd work/tf-mnt/boot.cmd
          sudo mkdir -p work/tf-mnt/dtb/rockchip
          sudo install -m 0644 work/boot/dtb/rockchip/rk3566-panther-x2.dtb work/tf-mnt/dtb/rockchip/rk3566-panther-x2.dtb
          printf '%s\n' \
            "Panther X2 Project-A G2 minimal runtime; PREPARE-ONLY." \
            "Kernel: Linux 6.18.63; Image and DTB are SHA256-pinned." \
            "RK809 MFD code is built-in but the RK809 DT node is disabled; no PMIC probe." \
            "GMAC1/MDIO/RTL8211F remain disabled; no physical Ethernet activation or TX." \
            "RAM initramfs with static BusyBox; no persistent root filesystem is mounted or written by /init." \
            "B1 storage/USB support is retained; MMC/eMMC/TF/SD and USB host/PHY may enumerate." \
            "USB network adapters remain disabled; external USB NICs are out of scope." \
            "Boot chain requires the existing eMMC SPL; JP-TvBox U-Boot proper is stored at raw LBA 16384." \
            "This image has not been written to any physical TF/eMMC and is not authorized for boot." \
            | sudo tee work/tf-mnt/TEST-INFO.txt >/dev/null
