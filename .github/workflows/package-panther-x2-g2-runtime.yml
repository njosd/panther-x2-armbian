      - name: Upload Project-A G2 runtime (PREPARE-ONLY)
        uses: actions/upload-artifact@v6
        with:
          name: panther-x2-project-a-g2-runtime-PREPARE-ONLY
          path: |
            work/output/
            work/boot/
            work/debug/
            work/logs-kernel-image.txt
          if-no-files-found: error
          retention-days: 30
 "$CONFIG"
            exit 1
          fi

          DTB=work/g2/output/dtb/rockchip/rk3566-panther-x2.dtb
          test "$(fdtget -t s "$DTB" / model)" = "Panther X2"
          fdtget -t s "$DTB" / compatible | grep -q 'panther,x2'
          fdtget -t s "$DTB" / compatible | grep -q 'rockchip,rk3566'
          test "$(fdtget -t s "$DTB" /i2c@fdd40000/pmic@20 status)" = "disabled"
          test "$(fdtget -t s "$DTB" /ethernet@fe010000 status)" = "disabled"
          test "$(fdtget -t s "$DTB" /ethernet@fe010000/mdio status)" = "disabled"
          test "$(fdtget -t s "$DTB" /ethernet@fe010000/mdio/ethernet-phy@0 status)" = "disabled"
          # Preserve the established B1 board boundary. An omitted DT status
          # property means "okay" per the Devicetree specification, matching B1's
          # original assert_status helper.
          assert_status() {
            local node="$1" expected="$2" actual
            if ! fdtget -l "$DTB" "$node" >/dev/null 2>&1; then
              echo "::error::DTB node missing: $node"
              exit 1
            fi
            actual="$(fdtget -t s "$DTB" "$node" status 2>/dev/null || true)"
            if [ -z "$actual" ]; then actual="okay (implicit default)"; fi
            if [ "$expected" = "okay" ] && [ "$actual" = "okay (implicit default)" ]; then
              echo "DTB status: $node = okay (implicit default)"
              return 0
            fi
            test "$actual" = "$expected" || {
              echo "::error::Unexpected DTB status: $node expected=$expected actual=$actual"
              exit 1
            }
          }
          assert_status /mmc@fe2c0000 disabled
          assert_status /mmc@fe310000 okay
          assert_status /mmc@fe2b0000 okay
          for node in /usb@fcc00000 /usb@fd800000 /usb@fd840000 \
            /usb2phy@fe8a0000 /usb2phy@fe8a0000/host-port /usb2phy@fe8a0000/otg-port; do
            assert_status "$node" okay
          done
          assert_status /serial@fe650000 okay
          if fdtget -l "$DTB" /serial@fe650000 | grep -qx bluetooth; then
            echo "::error::Bluetooth child remains under UART1"
            exit 1
          fi

          file work/g2/output/Image | tee work/logs-kernel-image.txt
          MAGIC="$(od -An -tx1 -j56 -N4 work/g2/output/Image | tr -d ' \n')"
          test "$MAGIC" = "41524d64"
          readelf -h work/b1/output/busybox | grep -q AArch64
          if readelf -l work/b1/output/busybox | grep -q INTERP; then
            echo "::error::B1 BusyBox must remain statically linked"
            exit 1
          fi

          mkdir -p work/output work/initramfs work/debug work/boot/dtb/rockchip work/logs
          cp work/g2/output/Image work/boot/Image
          cp work/g2/output/dtb/rockchip/rk3566-panther-x2.dtb work/boot/dtb/rockchip/rk3566-panther-x2.dtb
          cp work/g2/output/kernel.config work/output/kernel.config
          cp work/g2/output/System.map work/debug/System.map
          cp work/g2/output/vmlinux work/debug/vmlinux
          cp work/g2/output/G2-DTB-ISOLATION.txt work/output/G2-DTB-ISOLATION.txt
          cp work/g2/output/BUILD-MANIFEST.txt work/output/G2-BUILD-MANIFEST.txt
          cp work/g2/source-lock.txt work/output/G2-source-lock.txt
          cp work/g2/r1-reference-lock.txt work/output/G2-R1-reference-lock.txt
          cp work/b1/source-lock.txt work/output/B1-source-lock.txt
          cp -a work/g2/logs work/output/G2-build-logs
          cp work/b1/output/busybox work/initramfs/busybox
          cp work/b1/output/busybox work/output/busybox
          cp work/b1/output/busybox.config work/output/busybox.config
          cp work/b1/output/busybox-applets.txt work/output/busybox-applets.txt
          cp work/b1/output/JP-TvBox-u-boot.itb work/output/JP-TvBox-u-boot.itb
          cp work/g2/output/kernel.config work/output/kernel.config
          {
            echo "g2_run_id=$G2_RUN_ID"
            echo "g2_artifact_id=$G2_ARTIFACT_ID"
            echo "g2_artifact_sha256=db4edb124497821158225d0a2d16b2f3f4f98ccbeabd5e3a95e09cdd1d46e346"
            echo "b1_run_id=$B1_RUN_ID"
