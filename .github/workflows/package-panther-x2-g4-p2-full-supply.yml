name: Panther X2 Project-A G4-P2 full-supply IO-domain runtime (PREPARE ONLY)

on:
  push:
    branches:
      - g4-p0-binding-only-build
    paths:
      - "scripts/panther-x2-g4-p2-runtime/**"
      - ".github/workflows/package-panther-x2-g4-p2-full-supply.yml"
  workflow_dispatch:
    inputs:
      g4_build_run_id:
        description: "Frozen successful G4-P0 build-only run"
        required: true
        type: string
        default: "46091659151"
      g3_build_run_id:
        description: "Frozen successful G3 provider build-only run"
        required: true
        type: string
        default: "45984035650"
      g3_runtime_run_id:
        description: "Frozen successful G3 provider runtime package run"
        required: true
        type: string
        default: "45996817932"

permissions:
  contents: read
  actions: read

concurrency:
  group: panther-x2-project-a-g4-p2-full-supply-prepare-only
  cancel-in-progress: false

env:
  G4_BUILD_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.g4_build_run_id || '46091659151' }}
  G3_BUILD_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.g3_build_run_id || '45984035650' }}
  G3_RUNTIME_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.g3_runtime_run_id || '45996817932' }}
  G4_IMAGE_SHA256: "b34b8faaa34bcb843d82f11423489b434c1e2f329fedab1d81754fd192723090"
  G4_CONFIG_SHA256: "c990c913b283a7042a81be12369886e1faa95bbf5b2cc031fd9e1155a4357be2"
  G4_P0_DTB_SHA256: "c967aff4bb99748828fdf083a8e1701b915966e47c6828375399bef5e0048ff8"
  G3_BUSYBOX_SHA256: "2d77cb64f5ab5ca33efae040083abe31912ab02677dd21c1b79ade6ed0e98b15"
  JP_UBOOT_SHA256: "a1ae35a8522e4353611042e62c3b7b7eaa7e4b6955bae5e5c4f8499500dbfdce"

jobs:
  package-g4-p2-runtime:
    name: Assemble full-supply IO-domain RAM runtime; no hardware access
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact project revision
        uses: actions/checkout@v6

      - name: Install packaging and verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils cpio device-tree-compiler e2fsprogs file gdisk gzip qemu-user-static u-boot-tools zstd

      - name: Download frozen G4-P0 kernel build artifact
        uses: actions/download-artifact@v6
        with:
          name: panther-x2-g4-p0-binding-only-build-only
          path: work/g4
          repository: ${{ github.repository }}
          run-id: ${{ env.G4_BUILD_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download frozen G3 provider build artifact
        uses: actions/download-artifact@v6
        with:
          name: panther-x2-g3-rk809-regulator-provider-build-only
          path: work/g3-build
          repository: ${{ github.repository }}
          run-id: ${{ env.G3_BUILD_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download frozen G3 runtime support artifact
        uses: actions/download-artifact@v6
        with:
          name: panther-x2-project-a-g3-provider-runtime-PREPARE-ONLY
          path: work/g3-runtime
          repository: ${{ github.repository }}
          run-id: ${{ env.G3_RUNTIME_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify frozen inputs and derive the sole DTB change
        id: freeze_inputs
        run: |
          set -euo pipefail
          G4=work/g4/output
          G3B=work/g3-build/output
          G3R=work/g3-runtime/output
          G3R_BOOT=work/g3-runtime/boot

          for f in \
            "$G4/SHA256SUMS" "$G4/Image" "$G4/kernel.config" "$G4/System.map" "$G4/vmlinux" \
            "$G4/G4-P0-BUILD-MANIFEST.txt" "$G4/dtb/rockchip/rk3566-panther-x2.dtb" \
            "$G3B/SHA256SUMS" "$G3B/Image" "$G3B/kernel.config" \
            "$G3B/dtb/rockchip/rk3566-panther-x2.dtb" "$G3B/G3-BUILD-MANIFEST.txt" \
            "$G3R/SHA256SUMS" "$G3R/busybox" "$G3R/busybox.config" \
            "$G3R/JP-TvBox-u-boot.itb" "$G3R/RUNTIME-MANIFEST.txt" \
            "$G3R_BOOT/Image" "$G3R_BOOT/dtb/rockchip/rk3566-panther-x2.dtb"; do
            test -s "$f" || { echo "::error::Missing frozen input: $f"; exit 1; }
          done

          (cd "$G4" && sha256sum --check SHA256SUMS)
          (cd "$G3B" && sha256sum --check SHA256SUMS)
          (cd "$G3R" && sha256sum --check SHA256SUMS)

          test "$(sha256sum "$G4/Image" | awk '{print $1}')" = "$G4_IMAGE_SHA256"
          test "$(sha256sum "$G4/kernel.config" | awk '{print $1}')" = "$G4_CONFIG_SHA256"
          test "$(sha256sum "$G4/dtb/rockchip/rk3566-panther-x2.dtb" | awk '{print $1}')" = "$G4_P0_DTB_SHA256"
          test "$(sha256sum "$G3R/busybox" | awk '{print $1}')" = "$G3_BUSYBOX_SHA256"
          test "$(sha256sum "$G3R/JP-TvBox-u-boot.itb" | awk '{print $1}')" = "$JP_UBOOT_SHA256"

          G3_DTB_BUILD="$G3B/dtb/rockchip/rk3566-panther-x2.dtb"
          G3_DTB_RUNTIME="$G3R_BOOT/dtb/rockchip/rk3566-panther-x2.dtb"
          test "$(sha256sum "$G3_DTB_BUILD" | awk '{print $1}')" = "$(sha256sum "$G3_DTB_RUNTIME" | awk '{print $1}')"
          test "$(sha256sum "$G3R_BOOT/Image" | awk '{print $1}')" = "$(sha256sum "$G3B/Image" | awk '{print $1}')"
          test "$(sha256sum "$G3B/kernel.config" | awk '{print $1}')" = "$(sha256sum "$G3R/kernel.config" | awk '{print $1}')"

          G4_CONFIG="$G4/kernel.config"
          for key in CONFIG_OF CONFIG_MFD_SYSCON CONFIG_REGMAP CONFIG_REGMAP_MMIO \
                     CONFIG_REGULATOR CONFIG_REGULATOR_FIXED_VOLTAGE CONFIG_REGULATOR_RK808 \
                     CONFIG_MFD_RK8XX_I2C CONFIG_ROCKCHIP_IODOMAIN; do
            grep -qx "$key=y" "$G4_CONFIG" || { echo "::error::Required kernel option missing: $key"; exit 1; }
          done
          for key in CONFIG_STMMAC_ETH CONFIG_DWMAC_ROCKCHIP CONFIG_MDIO_BUS \
                     CONFIG_PHYLIB CONFIG_REALTEK_PHY CONFIG_BT CONFIG_WIRELESS \
                     CONFIG_WLAN CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_RFKILL; do
            if grep -Eq "^$key=[ym]$" "$G4_CONFIG"; then
              echo "::error::Forbidden network/BT option enabled: $key"
              exit 1
            fi
          done

          G3_MANIFEST="$G3B/G3-BUILD-MANIFEST.txt"
          for line in \
            "rk809_regulator_provider=built-in" \
            "fixed_regulator_provider=built-in" \
            "rockchip_iodomain=not-built" \
            "gmac1_mdio_phy=disabled" \
            "emmc_sdhci=disabled" \
            "tf_sdmmc0=disabled" \
            "sdio_sdmmc1=disabled" \
            "gpu=disabled" \
            "saradc=disabled"; do
            grep -Fqx "$line" "$G3_MANIFEST" || { echo "::error::G3 baseline manifest mismatch: $line"; exit 1; }
          done
          grep -Fq 'rk809_regulator_provider=built-in' "$G3R/RUNTIME-MANIFEST.txt"
          grep -Fq 'rockchip_iodomain=not-built; io_domains=disabled' "$G3R/RUNTIME-MANIFEST.txt"

          readelf -h "$G3R/busybox" | grep -q AArch64
          if readelf -l "$G3R/busybox" | grep -q INTERP; then
            echo "::error::G3 BusyBox must be statically linked"
            exit 1
          fi

          BASE="$G3_DTB_BUILD"
          CANDIDATE=work/candidate/rk3566-panther-x2.dtb
          mkdir -p work/candidate work/logs work/output work/boot/dtb/rockchip work/initramfs
          cp "$BASE" work/candidate/g3-baseline.dtb
          cp "$BASE" "$CANDIDATE"

          IO=/syscon@fdc20000/io-domains
          test "$(fdtget -t s "$BASE" / model)" = "Panther X2"
          fdtget -t s "$BASE" / compatible | grep -q 'panther,x2'
          fdtget -t s "$BASE" / compatible | grep -q 'rockchip,rk3566'
          test "$(fdtget -t s "$BASE" "$IO" status)" = "disabled"

          # Verify PMIC parent supply chain: RK809 vcc9 -> root fixed 3.3V regulator.
          PMIC=/i2c@fdd40000/pmic@20
          test "$(fdtget -t s "$BASE" "$PMIC" status)" = "okay"
          VCC9="$(fdtget -t x "$BASE" "$PMIC" vcc9-supply)"
          VCC33_PHANDLE="$(fdtget -t x "$BASE" /vcc3v3-sys-regulator phandle)"
          test "$VCC9" = "$VCC33_PHANDLE"
          test "$(fdtget -t s "$BASE" /vcc3v3-sys-regulator compatible)" = "regulator-fixed"
          test "$(fdtget -t s "$BASE" /vcc3v3-sys-regulator regulator-name)" = "vcc3v3_sys"
          test "$(fdtget -t u "$BASE" /vcc3v3-sys-regulator regulator-min-microvolt)" = "3300000"
          test "$(fdtget -t u "$BASE" /vcc3v3-sys-regulator regulator-max-microvolt)" = "3300000"

          SUPPLY_PROPS="pmuio1-supply pmuio2-supply vccio1-supply vccio2-supply vccio3-supply vccio4-supply vccio5-supply vccio6-supply vccio7-supply"
          : > work/output/G4-P2-SUPPLY-PHANDLE-AUDIT.txt
          for prop in $SUPPLY_PROPS; do
            value="$(fdtget -t x "$BASE" "$IO" "$prop")"
            test -n "$value"
            printf '%s=%s\n' "$prop" "$value" | tee -a work/output/G4-P2-SUPPLY-PHANDLE-AUDIT.txt
          done

          # Single DTB edit: enable only the IO-domain consumer node.
          fdtput -t s "$CANDIDATE" "$IO" status okay
          test "$(fdtget -t s "$CANDIDATE" "$IO" status)" = "okay"
          for prop in $SUPPLY_PROPS; do
            test "$(fdtget -t x "$BASE" "$IO" "$prop")" = "$(fdtget -t x "$CANDIDATE" "$IO" "$prop")"
          done

          # Canonical DTS comparison: every byte of the logical tree must match
          # after normalizing only this one status value back to the baseline.
          dtc -s -I dtb -O dts -o work/logs/g3-baseline.dts "$BASE"
          dtc -s -I dtb -O dts -o work/logs/g4-p2-candidate.dts "$CANDIDATE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          base = Path("work/logs/g3-baseline.dts").read_text()
          candidate = Path("work/logs/g4-p2-candidate.dts").read_text()
          pattern = re.compile(r'(?s)(io-domains\s*\{.*?\bstatus\s*=\s*)"okay"(\s*;.*?\n\s*\};)')
          normalized, count = pattern.subn(r'\1"disabled"\2', candidate, count=1)
          if count != 1:
              raise SystemExit(f"expected exactly one IO-domain node status to normalize, got {count}")
          if normalized != base:
              import difflib
              print("".join(difflib.unified_diff(base.splitlines(True), normalized.splitlines(True),
                                                 fromfile="G3 baseline", tofile="G4-P2 normalized")))
              raise SystemExit("DTB logical diff contains changes beyond IO-domain status")
          print("DTB logical diff: exactly /syscon@fdc20000/io-domains/status disabled -> okay")
          PY

          # Explicitly prove all other sensitive consumers remain isolated.
          assert_status() {
            local node="$1" expected="$2" actual
            actual="$(fdtget -t s "$CANDIDATE" "$node" status 2>/dev/null || true)"
            if [ -z "$actual" ]; then actual="okay"; fi
            test "$actual" = "$expected" || { echo "::error::$node status=$actual expected=$expected"; exit 1; }
          }
          assert_status "$PMIC" okay
          assert_status "$IO" okay
          assert_status /mmc@fe310000 disabled
          assert_status /mmc@fe2b0000 disabled
          assert_status /mmc@fe2c0000 disabled
          assert_status /gpu@fde60000 disabled
          assert_status /saradc@fe720000 disabled
          assert_status /ethernet@fe010000 disabled
          assert_status /ethernet@fe010000/mdio disabled
          assert_status /ethernet@fe010000/mdio/ethernet-phy@0 disabled

          cp "$G4/Image" work/boot/Image
          cp "$CANDIDATE" work/boot/dtb/rockchip/rk3566-panther-x2.dtb
          cp "$G4/kernel.config" work/output/kernel.config
          cp "$G4/System.map" work/output/System.map
          cp "$G4/vmlinux" work/output/vmlinux
          cp "$G4/G4-P0-BUILD-MANIFEST.txt" work/output/G4-P0-BUILD-MANIFEST.txt
          cp "$G3R/busybox" work/output/busybox
          cp "$G3R/busybox.config" work/output/busybox.config
          cp "$G3R/JP-TvBox-u-boot.itb" work/output/JP-TvBox-u-boot.itb
          cp "$G4/SHA256SUMS" work/output/G4-P0-BUILD-SHA256SUMS.txt
          cp "$G3B/SHA256SUMS" work/output/G3-BUILD-SHA256SUMS.txt
          cp "$G3R/SHA256SUMS" work/output/G3-RUNTIME-SHA256SUMS.txt
          {
            echo "g4_build_run_id=$G4_BUILD_RUN_ID"
            echo "g3_build_run_id=$G3_BUILD_RUN_ID"
            echo "g3_runtime_run_id=$G3_RUNTIME_RUN_ID"
            echo "g4_image_sha256=$G4_IMAGE_SHA256"
            echo "g4_config_sha256=$G4_CONFIG_SHA256"
            echo "g4_p0_dtb_sha256=$G4_P0_DTB_SHA256"
            echo "g3_baseline_dtb_sha256=$(sha256sum "$BASE" | awk '{print $1}')"
            echo "g4_p2_candidate_dtb_sha256=$(sha256sum "$CANDIDATE" | awk '{print $1}')"
            echo "busybox_sha256=$G3_BUSYBOX_SHA256"
            echo "jp_uboot_sha256=$JP_UBOOT_SHA256"
          } | tee work/output/G4-P2-FROZEN-INPUTS.txt
          sha256sum "$CANDIDATE" | tee work/output/G4-P2-DTB-SHA256.txt

      - name: Build and verify minimal G4-P2 RAM initramfs
        run: |
          set -euo pipefail
          ROOT=work/initramfs
          mkdir -p "$ROOT/bin" "$ROOT/dev" "$ROOT/proc" "$ROOT/sys" "$ROOT/run" "$ROOT/etc" "$ROOT/sbin"
          install -m 0755 work/output/busybox "$ROOT/bin/busybox"
          for applet in ash sh mount mkdir cat uname dmesg tail echo ls test; do
            qemu-aarch64-static "$ROOT/bin/busybox" --list | grep -qx "$applet"
            ln -s busybox "$ROOT/bin/$applet"
          done
          install -m 0755 scripts/panther-x2-g4-p2-runtime/init "$ROOT/init"
          install -m 0755 scripts/panther-x2-g4-p2-runtime/capture-g4-p2.sh "$ROOT/capture-g4-p2.sh"
          qemu-aarch64-static "$ROOT/bin/busybox" ash -n "$ROOT/init"
          qemu-aarch64-static "$ROOT/bin/busybox" ash -n "$ROOT/capture-g4-p2.sh"
          cp scripts/panther-x2-g4-p2-runtime/init work/output/init
          cp scripts/panther-x2-g4-p2-runtime/capture-g4-p2.sh work/output/capture-g4-p2.sh
          cp scripts/panther-x2-g4-p2-runtime/boot.cmd work/output/boot.cmd

          (cd "$ROOT" && find . -print0 | sort -z | cpio --null -o --format=newc) | gzip -n -9 > work/output/initramfs.cpio.gz
          mkimage -A arm64 -O linux -T ramdisk -C gzip -n "Panther X2 G4-P2 full-supply IO-domain runtime" -d work/output/initramfs.cpio.gz work/boot/uInitrd
          mkimage -l work/boot/uInitrd | tee work/output/uinitrd-header.txt
          grep -qi AArch64 work/output/uinitrd-header.txt

          mkdir -p work/initramfs-check
          gzip -dc work/output/initramfs.cpio.gz | (cd work/initramfs-check && cpio -idm --quiet)
          cmp scripts/panther-x2-g4-p2-runtime/init work/initramfs-check/init
          cmp scripts/panther-x2-g4-p2-runtime/capture-g4-p2.sh work/initramfs-check/capture-g4-p2.sh
          cmp work/output/busybox work/initramfs-check/bin/busybox
          test -x work/initramfs-check/init
          test -x work/initramfs-check/capture-g4-p2.sh
          sha256sum work/output/initramfs.cpio.gz work/boot/uInitrd | tee work/output/initramfs-sha256.txt

      - name: Generate boot.scr and SU08G-sized PREPARE-ONLY image on runner
        run: |
          set -euo pipefail
          mkimage -A arm -O linux -T script -C none -n "Panther X2 G4-P2 full-supply IO-domain runtime" -d work/output/boot.cmd work/boot/boot.scr
          mkimage -l work/boot/boot.scr | tee work/output/bootscr-header.txt

          IMAGE=work/output/panther-x2-project-a-g4-p2-full-supply-PREPARE-ONLY.img
          IMAGE_ZST="$IMAGE.zst"
          TF_IMAGE_BYTES=7948206080
          TF_SECTOR_SIZE=512
          TF_TOTAL_SECTORS=15523840
          TF_FIRST_PARTITION_SECTOR=32768
          TF_LAST_USABLE_SECTOR=$((TF_TOTAL_SECTORS - 34))
          test "$((TF_TOTAL_SECTORS * TF_SECTOR_SIZE))" -eq "$TF_IMAGE_BYTES"
          test "$TF_LAST_USABLE_SECTOR" -eq 15523806

          truncate -s "$TF_IMAGE_BYTES" "$IMAGE"
          sgdisk --clear --new=1:${TF_FIRST_PARTITION_SECTOR}:${TF_LAST_USABLE_SECTOR} --typecode=1:8300 --change-name=1:PANTHER_BOOT "$IMAGE"

          mkdir -p work/tf-mnt
          LOOP="$(sudo losetup --find --show --partscan "$IMAGE")"
          cleanup() {
            sudo umount work/tf-mnt 2>/dev/null || true
            sudo losetup -d "$LOOP" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo partprobe "$LOOP"
          sleep 2
          PART="${LOOP}p1"
          test -b "$PART"
          sudo mkfs.ext4 -F -L PANTHER_BOOT "$PART"
          sudo mount "$PART" work/tf-mnt
          sudo install -m 0644 work/boot/Image work/tf-mnt/Image
          sudo install -m 0644 work/boot/uInitrd work/tf-mnt/uInitrd
          sudo install -m 0644 work/boot/boot.scr work/tf-mnt/boot.scr
          sudo install -m 0644 work/output/boot.cmd work/tf-mnt/boot.cmd
          sudo mkdir -p work/tf-mnt/dtb/rockchip
          sudo install -m 0644 work/boot/dtb/rockchip/rk3566-panther-x2.dtb work/tf-mnt/dtb/rockchip/rk3566-panther-x2.dtb
          sudo tee work/tf-mnt/TEST-INFO.txt >/dev/null <<'EOF'
          Panther X2 Project-A G4-P2 full-supply IO-domain runtime; PREPARE-ONLY.
          Linux 6.18.63; Image/config/DTB/initramfs hashes are in G4-P2-RUNTIME-MANIFEST.txt.
          IO-domain child enabled with all nine original supply phandles retained.
          Expected at boot: regulator voltage lookups, notifier registration and PMU GRF selector writes.
          These writes occur only through the standard rockchip-iodomain driver path.
          No raw PMIC/PMUGRF register access is performed by the initramfs collector.
          GMAC1, MDIO and RTL8211F remain disabled; no network TX is attempted.
          eMMC SDHCI, TF SDMMC0, SDIO, GPU and SARADC remain disabled.
          RAM initramfs only; no persistent root filesystem is mounted.
          Existing eMMC SPL is required; JP-TvBox U-Boot proper is at raw LBA 16384 on SU08G.
          Target capacity 7,948,206,080 bytes; GPT PANTHER_BOOT ext4 starts at LBA 32768.
          Cloud build only. No physical media is written. Runtime boot is NOT AUTHORIZED by this artifact.
          EOF
          sync
          sudo umount work/tf-mnt
          sudo e2fsck -fn "$PART"
          sudo losetup -d "$LOOP"
          trap - EXIT

          dd if=work/output/JP-TvBox-u-boot.itb of="$IMAGE" bs=512 seek=16384 conv=notrunc status=none
          sgdisk -v "$IMAGE"
          sgdisk -i 1 "$IMAGE" | tee work/output/tf-partition-1.txt
          grep -q 'Linux filesystem' work/output/tf-partition-1.txt
          UBOOT_SIZE="$(stat -c %s work/output/JP-TvBox-u-boot.itb)"
          UBOOT_READBACK="$(dd if="$IMAGE" bs=1 skip=$((16384 * 512)) count="$UBOOT_SIZE" status=none | sha256sum | awk '{print $1}')"
          test "$UBOOT_READBACK" = "$JP_UBOOT_SHA256"

          LOOP="$(sudo losetup --find --show --partscan --read-only "$IMAGE")"
          cleanup() {
            sudo umount work/tf-mnt 2>/dev/null || true
            sudo losetup -d "$LOOP" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo partprobe "$LOOP"
          sleep 2
          PART="${LOOP}p1"
          sudo mount -o ro "$PART" work/tf-mnt
          for item in Image uInitrd boot.scr boot.cmd TEST-INFO.txt dtb/rockchip/rk3566-panther-x2.dtb; do
            test -s "work/tf-mnt/$item"
          done
          test "$(sha256sum work/tf-mnt/Image | awk '{print $1}')" = "$G4_IMAGE_SHA256"
          test "$(sha256sum work/tf-mnt/dtb/rockchip/rk3566-panther-x2.dtb | awk '{print $1}')" = "$(sha256sum work/boot/dtb/rockchip/rk3566-panther-x2.dtb | awk '{print $1}')"
          test "$(sha256sum work/tf-mnt/uInitrd | awk '{print $1}')" = "$(sha256sum work/boot/uInitrd | awk '{print $1}')"
          (cd work/tf-mnt && find . -path './lost+found' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum) | tee work/output/tf-files.sha256
          sudo umount work/tf-mnt
          sudo losetup -d "$LOOP"
          trap - EXIT

          sha256sum "$IMAGE" | tee work/output/tf-image-sha256.txt
          zstd -T0 -10 "$IMAGE" -o "$IMAGE_ZST"
          zstd -t "$IMAGE_ZST"
          sha256sum "$IMAGE_ZST" >> work/output/tf-image-sha256.txt
          rm -f "$IMAGE"

      - name: Create PREPARE-ONLY manifest and final checksums
        run: |
          set -euo pipefail
          {
            echo "status=PASS_PREPARE_ONLY"
            echo "purpose=G4-P2 full-supply IO-domain RAM runtime; packaging and offline verification only"
            echo "g4_build_run_id=$G4_BUILD_RUN_ID"
            echo "g3_build_run_id=$G3_BUILD_RUN_ID"
            echo "g3_runtime_run_id=$G3_RUNTIME_RUN_ID"
            echo "kernel_version=6.18.63"
            echo "kernel_source_commit=aee4e352a15d636cbc484f56819c6e59474dfd9f"
            echo "kernel_image_sha256=$G4_IMAGE_SHA256"
            echo "kernel_config_sha256=$G4_CONFIG_SHA256"
            echo "g3_baseline_dtb_sha256=$(sha256sum work/candidate/g3-baseline.dtb | awk '{print $1}')"
            echo "g4_p2_candidate_dtb_sha256=$(sha256sum work/boot/dtb/rockchip/rk3566-panther-x2.dtb | awk '{print $1}')"
            echo "io_domain_status=okay"
            echo "io_domain_supply_properties=all_nine_retained_and_phandles_verified"
            echo "rk809_vcc9_supply=vcc3v3_sys_fixed_3300000uV"
            echo "rockchip_iodomain=built-in"
            echo "rk809_regulator_provider=built-in"
            echo "gmac1_mdio_phy=disabled"
            echo "emmc_sdhci=disabled; tf_sdmmc0=disabled; sdio_sdmmc1=disabled"
            echo "gpu=disabled; saradc=disabled"
            echo "runtime_expected=regulator_voltage_lookup; notifier_registration; PMU_GRF_selector_writes"
            echo "runtime_probe=not_executed"
            echo "selector_writes=not_executed_during_build"
            echo "physical_media_writes=none"
            echo "hardware_authorization=NOT_GRANTED"
            echo "target_media=SU08G only; capacity_bytes=7948206080"
            echo "SN64G=untouched"
            echo "eMMC=untouched"
            echo "rootfs=RAM initramfs; no persistent filesystem mounted by /init"
            echo "bootargs=console=ttyS02,1500000 earlycon loglevel=8 ignore_loglevel printk.time=1 rdinit=/init regulator_ignore_unused"
            echo "load_addresses=Image:0x00280000;uInitrd:0x0a200000;DTB:0x0a100000"
            echo "uboot_proper_location=raw_LBA_16384"
            echo "init_sha256=$(sha256sum work/output/init | awk '{print $1}')"
            echo "capture_script_sha256=$(sha256sum work/output/capture-g4-p2.sh | awk '{print $1}')"
            echo "boot_cmd_sha256=$(sha256sum work/output/boot.cmd | awk '{print $1}')"
            echo "initramfs_sha256=$(sha256sum work/output/initramfs.cpio.gz | awk '{print $1}')"
            echo "uinitrd_sha256=$(sha256sum work/boot/uInitrd | awk '{print $1}')"
            echo "bootscr_sha256=$(sha256sum work/boot/boot.scr | awk '{print $1}')"
            cat work/output/tf-image-sha256.txt
          } | tee work/output/G4-P2-RUNTIME-MANIFEST.txt

          (
            cd work/output
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload G4-P2 full-supply runtime package (PREPARE-ONLY; no device access)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: panther-x2-project-a-g4-p2-full-supply-PREPARE-ONLY
          path: |
            work/output/
            work/boot/
            work/logs/
          if-no-files-found: error
          retention-days: 30
