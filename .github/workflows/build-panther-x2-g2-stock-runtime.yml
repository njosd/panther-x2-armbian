name: Panther X2 Project A G2 stock runtime candidate build-only

on:
  workflow_dispatch:
    inputs:
      r1_run_id:
        description: "Successful R1 network-core run containing the frozen R1 config and Panther DTB"
        required: true
        type: string
        default: "45611898629"

permissions:
  contents: read
  actions: read

concurrency:
  group: panther-x2-project-a-g2-stock-runtime-candidate
  cancel-in-progress: false

env:
  KERNEL_VERSION: "6.18.63"
  KERNEL_SOURCE_REPO: "https://github.com/ophub/linux-6.18.y.git"
  KERNEL_SOURCE_COMMIT: "aee4e352a15d636cbc484f56819c6e59474dfd9f"
  R1_RUN_ID: ${{ inputs.r1_run_id }}

jobs:
  g2-stock-runtime-candidate-build-only:
    name: Build stock RK8xx MFD, RTC and PWRKEY candidate; no probe
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact project revision
        uses: actions/checkout@v6

      - name: Install isolated build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl device-tree-compiler \
            file flex gcc-aarch64-linux-gnu git libelf-dev \
            libncurses-dev libssl-dev make perl python3 \
            binutils kmod zstd

      - name: Restore the successful R1 configuration and Panther DTB artifact
        uses: actions/download-artifact@v6
        with:
          name: b2-1-r1-network-core
          path: work/r1-reference
          repository: ${{ github.repository }}
          run-id: ${{ inputs.r1_run_id }}
          github-token: ${{ github.token }}

      - name: Verify and freeze R1 input identity
        id: freeze_r1_inputs
        run: |
          set -euo pipefail
          R1_CONFIG=work/r1-reference/output/kernel.config
          R1_DTB=work/r1-reference/output/dtb/rockchip/rk3566-panther-x2.dtb
          test -s "$R1_CONFIG"
          test -s "$R1_DTB"
          test "$(sha256sum "$R1_DTB" | awk '{print $1}')" = "7aa4e8a15469bfdda828dcdaf4f4bfea546df378a0ebb040e0ef6df68585179d"
          test "$(fdtget -t s "$R1_DTB" / model)" = "Panther X2"
          fdtget -t s "$R1_DTB" / compatible | grep -q 'panther,x2'
          fdtget -t s "$R1_DTB" / compatible | grep -q 'rockchip,rk3566'
          grep -qx 'CONFIG_NET=y' "$R1_CONFIG"
          grep -qx 'CONFIG_PACKET=y' "$R1_CONFIG"
          for key in CONFIG_STMMAC_ETH CONFIG_DWMAC_ROCKCHIP CONFIG_MDIO_BUS CONFIG_PHYLIB; do
            if grep -Eq "^$key=[ym]$" "$R1_CONFIG"; then
              echo "::error::R1 baseline unexpectedly enables $key"
              grep -E "^$key=" "$R1_CONFIG"
              exit 1
            fi
          done
          mkdir -p work/reference
          cp "$R1_CONFIG" work/reference/r1-kernel.config
          cp "$R1_DTB" work/reference/r1-panther-x2.dtb
          {
            echo "r1_run_id=${R1_RUN_ID}"
            echo "r1_config_sha256=$(sha256sum work/reference/r1-kernel.config | awk '{print $1}')"
            echo "r1_dtb_sha256=$(sha256sum work/reference/r1-panther-x2.dtb | awk '{print $1}')"
            echo "r1_input=artifact:b2-1-r1-network-core"
          } | tee work/r1-reference-lock.txt
          echo "r1_config_sha256=$(sha256sum work/reference/r1-kernel.config | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Fetch the exact Linux source and apply the audited R1 compatibility patch
        run: |
          set -euo pipefail
          mkdir -p work/logs work/output work/kernel-out
          git init work/linux
          git -C work/linux remote add origin "${KERNEL_SOURCE_REPO}"
          git -C work/linux fetch --depth=1 origin "${KERNEL_SOURCE_COMMIT}"
          git -C work/linux checkout --detach FETCH_HEAD
          ACTUAL_COMMIT="$(git -C work/linux rev-parse HEAD)"
          test "$ACTUAL_COMMIT" = "${KERNEL_SOURCE_COMMIT}"
          grep -qx 'VERSION = 6' work/linux/Makefile
          grep -qx 'PATCHLEVEL = 18' work/linux/Makefile
          grep -qx 'SUBLEVEL = 63' work/linux/Makefile
          PATCH="$GITHUB_WORKSPACE/scripts/panther-x2-b1/patches/0001-broadcast-uevent-net-only-api.patch"
          test -s "$PATCH"
          git -C work/linux apply --check "$PATCH"
          git -C work/linux apply "$PATCH"
          git -C work/linux diff --check
          {
            echo "kernel_source=${KERNEL_SOURCE_REPO}"
            echo "kernel_commit=$ACTUAL_COMMIT"
            echo "kernel_version=${KERNEL_VERSION}"
            echo "r1_compat_patch=$PATCH"
            echo "r1_compat_patch_sha256=$(sha256sum "$PATCH" | awk '{print $1}')"
            echo "r1_config_sha256=$(sha256sum work/reference/r1-kernel.config | awk '{print $1}')"
            echo "g2_fragment_sha256=$(sha256sum scripts/panther-x2-g2/g2-stock-runtime.fragment | awk '{print $1}')"
          } | tee work/source-lock.txt

      - name: Restore incremental G2 kernel object cache for retries
        uses: actions/cache/restore@v4
        with:
          path: work/kernel-out
          key: panther-x2-g2-stock-${{ env.KERNEL_SOURCE_COMMIT }}-${{ steps.freeze_r1_inputs.outputs.r1_config_sha256 }}-${{ hashFiles('scripts/panther-x2-g2/g2-stock-runtime.fragment', 'scripts/panther-x2-b1/patches/0001-broadcast-uevent-net-only-api.patch', '.github/workflows/build-panther-x2-g2-stock-runtime.yml') }}

      - name: Merge only the G2 MFD delta into the frozen R1 configuration
        id: merge_g2_config
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/work/linux"
          OUT="$GITHUB_WORKSPACE/work/kernel-out"
          BASE="$GITHUB_WORKSPACE/work/reference/r1-kernel.config"
          FRAGMENT="$GITHUB_WORKSPACE/scripts/panther-x2-g2/g2-stock-runtime.fragment"
          mkdir -p "$OUT"
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            "$SRC/scripts/kconfig/merge_config.sh" -m -r -O "$OUT" "$BASE" "$FRAGMENT" \
            2>&1 | tee work/logs/g2-config-merge.log
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          cp "$OUT/.config" work/output/kernel.config
          diff -u "$BASE" work/output/kernel.config > work/logs/g2-config-diff.txt || test "$?" -eq 1

          require_y() {
            grep -qx "$1=y" work/output/kernel.config || {
              echo "::error::Expected $1=y"
              exit 1
            }
          }
          require_off() {
            if grep -Eq "^$1=[ym]$" work/output/kernel.config; then
              echo "::error::Forbidden $1 enabled"
              grep -E "^$1=" work/output/kernel.config
              exit 1
            fi
          }
          for key in CONFIG_NET CONFIG_PACKET CONFIG_OF CONFIG_I2C CONFIG_I2C_RK3X CONFIG_REGMAP_I2C \
                     CONFIG_REGMAP_IRQ CONFIG_IRQ_DOMAIN CONFIG_MFD_CORE CONFIG_MFD_RK8XX CONFIG_MFD_RK8XX_I2C \
                     CONFIG_MODULES CONFIG_GPIOLIB CONFIG_GPIO_ROCKCHIP CONFIG_PINCTRL_ROCKCHIP \
                     CONFIG_INPUT CONFIG_INPUT_MISC CONFIG_INPUT_EVDEV CONFIG_RTC_CLASS \
                     CONFIG_RTC_INTF_SYSFS CONFIG_RTC_INTF_PROC CONFIG_RTC_INTF_DEV \
                     CONFIG_RTC_DRV_RK808 CONFIG_INPUT_RK805_PWRKEY; do
            require_y "$key"
          done
          for key in CONFIG_RTC_HCTOSYS CONFIG_RTC_SYSTOHC CONFIG_REGULATOR_RK808 CONFIG_STMMAC_ETH \
                     CONFIG_DWMAC_ROCKCHIP CONFIG_MDIO_BUS CONFIG_PHYLIB CONFIG_REALTEK_PHY \
                     CONFIG_BT CONFIG_WIRELESS CONFIG_WLAN CONFIG_CFG80211 CONFIG_MAC80211 \
                     CONFIG_RFKILL; do
            require_off "$key"
          done
          cp "$FRAGMENT" work/output/g2-rk8xx-mfd.fragment
          echo "G2 Kconfig dependency and isolation gates: PASS" | tee work/logs/g2-config-gates.txt

      - name: Build the configured kernel Image
        id: build_kernel
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/work/linux"
          OUT="$GITHUB_WORKSPACE/work/kernel-out"
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 Image \
            2>&1 | tee work/logs/g2-kernel-build.log
          install -m 0644 "$OUT/arch/arm64/boot/Image" work/output/Image
          install -m 0644 "$OUT/System.map" work/output/System.map
          install -m 0644 "$OUT/vmlinux" work/output/vmlinux
          file work/output/Image | tee work/output/kernel-image-file.txt
          IMAGE_MAGIC="$(od -An -tx1 -j56 -N4 work/output/Image | tr -d ' \n')"
          test "$IMAGE_MAGIC" = "41524d64"

      - name: Save incremental G2 kernel object cache for retry
        if: steps.build_kernel.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: work/kernel-out
          key: panther-x2-g2-stock-${{ env.KERNEL_SOURCE_COMMIT }}-${{ steps.freeze_r1_inputs.outputs.r1_config_sha256 }}-${{ hashFiles('scripts/panther-x2-g2/g2-stock-runtime.fragment', 'scripts/panther-x2-b1/patches/0001-broadcast-uevent-net-only-api.patch', '.github/workflows/build-panther-x2-g2-stock-runtime.yml') }}

      - name: Verify MFD built-in objects and isolate the PMIC in the DTB
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/work/kernel-out"
          for obj in drivers/i2c/busses/i2c-rk3x.o drivers/gpio/gpio-rockchip.o drivers/pinctrl/pinctrl-rockchip.o drivers/mfd/rk8xx-core.o drivers/mfd/rk8xx-i2c.o drivers/rtc/rtc-rk808.o drivers/input/misc/rk805-pwrkey.o; do
            test -s "$OUT/$obj" || {
              echo "::error::Expected built-in object missing: $obj"
              exit 1
            }
          done
          nm -a "$OUT/drivers/i2c/busses/i2c-rk3x.o" > work/logs/i2c-rk3x-symbols.txt
          nm -a "$OUT/drivers/gpio/gpio-rockchip.o" > work/logs/gpio-rockchip-symbols.txt
          nm -a "$OUT/drivers/pinctrl/pinctrl-rockchip.o" > work/logs/pinctrl-rockchip-symbols.txt
          grep -q 'rk3x_i2c_probe' work/logs/i2c-rk3x-symbols.txt
          grep -q 'rockchip_gpio_probe' work/logs/gpio-rockchip-symbols.txt
          grep -q 'rockchip_pinctrl_probe' work/logs/pinctrl-rockchip-symbols.txt
          nm -a "$OUT/drivers/mfd/rk8xx-core.o" > work/logs/rk8xx-core-symbols.txt
          nm -a "$OUT/drivers/mfd/rk8xx-i2c.o" > work/logs/rk8xx-i2c-symbols.txt
          grep -q 'rk8xx_probe' work/logs/rk8xx-core-symbols.txt
          grep -q 'rk8xx_i2c_probe' work/logs/rk8xx-i2c-symbols.txt
          nm -a "$OUT/drivers/rtc/rtc-rk808.o" > work/logs/rk808-rtc-symbols.txt
          nm -a "$OUT/drivers/input/misc/rk805-pwrkey.o" > work/logs/rk805-pwrkey-symbols.txt
          grep -q 'rk808_rtc_probe' work/logs/rk808-rtc-symbols.txt
          grep -q 'rk805_pwrkey_probe' work/logs/rk805-pwrkey-symbols.txt
          nm -a work/output/vmlinux | awk '$NF == "rk3x_i2c_probe" || $NF == "rockchip_gpio_probe" || $NF == "rockchip_pinctrl_probe" || $NF == "rk8xx_probe" || $NF == "rk8xx_i2c_probe" { print }' > work/logs/g2-mfd-linked-symbols.txt
          grep -q 'rk3x_i2c_probe' work/logs/g2-mfd-linked-symbols.txt
          grep -q 'rockchip_gpio_probe' work/logs/g2-mfd-linked-symbols.txt
          grep -q 'rockchip_pinctrl_probe' work/logs/g2-mfd-linked-symbols.txt
          grep -q 'rk8xx_probe' work/logs/g2-mfd-linked-symbols.txt
          grep -q 'rk8xx_i2c_probe' work/logs/g2-mfd-linked-symbols.txt
          nm -a work/output/vmlinux | grep 'rk808_rtc_probe' > work/logs/g2-rtc-linked-symbol.txt
          nm -a work/output/vmlinux | grep 'rk805_pwrkey_probe' > work/logs/g2-pwrkey-linked-symbol.txt

          mkdir -p work/output/dtb/rockchip
          cp work/reference/r1-panther-x2.dtb work/output/dtb/rockchip/rk3566-panther-x2.dtb
          DTB=work/output/dtb/rockchip/rk3566-panther-x2.dtb
          fdtput -t s "$DTB" /i2c@fdd40000/pmic@20 status okay
          test "$(fdtget -t s "$DTB" /i2c@fdd40000/pmic@20 status)" = "okay"
          test "$(fdtget -t s "$DTB" /ethernet@fe010000 status)" = "disabled"
          test "$(fdtget -t s "$DTB" /ethernet@fe010000/mdio status)" = "disabled"
          test "$(fdtget -t s "$DTB" /ethernet@fe010000/mdio/ethernet-phy@0 status)" = "disabled"
          {
            echo "model=$(fdtget -t s "$DTB" / model)"
            echo "compatible=$(fdtget -t s "$DTB" / compatible)"
            echo "rk809_status=$(fdtget -t s "$DTB" /i2c@fdd40000/pmic@20 status)"
            echo "gmac1_status=$(fdtget -t s "$DTB" /ethernet@fe010000 status)"
            echo "mdio_status=$(fdtget -t s "$DTB" /ethernet@fe010000/mdio status)"
            echo "phy_status=$(fdtget -t s "$DTB" /ethernet@fe010000/mdio/ethernet-phy@0 status)"
            sha256sum "$DTB"
          } | tee work/output/G2-DTB-ISOLATION.txt
          grep -qx 'rk809_status=okay' work/output/G2-DTB-ISOLATION.txt
          grep -qx 'gmac1_status=disabled' work/output/G2-DTB-ISOLATION.txt
          grep -qx 'mdio_status=disabled' work/output/G2-DTB-ISOLATION.txt
          grep -qx 'phy_status=disabled' work/output/G2-DTB-ISOLATION.txt

          sha256sum "$OUT/drivers/i2c/busses/i2c-rk3x.o" "$OUT/drivers/gpio/gpio-rockchip.o" \
            "$OUT/drivers/pinctrl/pinctrl-rockchip.o" "$OUT/drivers/mfd/rk8xx-core.o" "$OUT/drivers/mfd/rk8xx-i2c.o" \
            "$OUT/drivers/rtc/rtc-rk808.o" "$OUT/drivers/input/misc/rk805-pwrkey.o" \
            | tee work/output/G2-MFD-OBJECTS-SHA256.txt
          {
            echo "kernel_config_sha256=$(sha256sum work/output/kernel.config | awk '{print $1}')"
            echo "Image_sha256=$(sha256sum work/output/Image | awk '{print $1}')"
            echo "vmlinux_sha256=$(sha256sum work/output/vmlinux | awk '{print $1}')"
            echo "dtb_sha256=$(sha256sum "$DTB" | awk '{print $1}')"
            echo "i2c_rk3x_object_sha256=$(sha256sum "$OUT/drivers/i2c/busses/i2c-rk3x.o" | awk '{print $1}')"
            echo "gpio_rockchip_object_sha256=$(sha256sum "$OUT/drivers/gpio/gpio-rockchip.o" | awk '{print $1}')"
            echo "pinctrl_rockchip_object_sha256=$(sha256sum "$OUT/drivers/pinctrl/pinctrl-rockchip.o" | awk '{print $1}')"
            echo "rk8xx_core_object_sha256=$(sha256sum "$OUT/drivers/mfd/rk8xx-core.o" | awk '{print $1}')"
            echo "rk8xx_i2c_object_sha256=$(sha256sum "$OUT/drivers/mfd/rk8xx-i2c.o" | awk '{print $1}')"
            echo "rtc_rk808_object_sha256=$(sha256sum "$OUT/drivers/rtc/rtc-rk808.o" | awk '{print $1}')"
            echo "rk805_pwrkey_object_sha256=$(sha256sum "$OUT/drivers/input/misc/rk805-pwrkey.o" | awk '{print $1}')"
            echo "built_in_symbols=rk3x_i2c_probe,rockchip_gpio_probe,rockchip_pinctrl_probe,rk8xx_probe,rk8xx_i2c_probe,rk808_rtc_probe,rk805_pwrkey_probe"
            echo "rk809_node=okay"
            echo "rtc_drv_rk808=built-in"
            echo "input_rk805_pwrkey=built-in"
            echo "gmac1_mdio_phy=disabled"
            echo "regulator_rk808=not-set"
            echo "rtc_hctosys=not-set"
            echo "rtc_systohc=not-set"
            echo "module_support=enabled in R1 baseline; G2 builds Image only; RK8xx MFD objects must be built-in"
            echo "purpose=G2 stock runtime candidate build-only; no hardware probe or PMIC access"
          } | tee work/output/BUILD-MANIFEST.txt
          (
            cd work/output
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload successful G2 stock-runtime candidate
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: panther-x2-g2-stock-runtime-candidate-build-only
          path: |
            work/output/
            work/logs/
            work/source-lock.txt
            work/r1-reference-lock.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed build diagnostics only
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: panther-x2-g2-stock-runtime-candidate-failed-diagnostics
          path: |
            work/logs/
            work/source-lock.txt
            work/r1-reference-lock.txt
            work/output/kernel.config
          if-no-files-found: warn
          retention-days: 14
