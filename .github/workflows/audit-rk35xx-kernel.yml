name: Compare Ophub RK35xx 6.12.81 kernel assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install read-only audit tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils curl device-tree-compiler file git

      - name: Download and inspect both official RK35xx assets
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.env
          mkdir -p work/reports

          audit_one() {
            local label="$1" asset="$2" url="$3" expected_sha="$4" expected_size="$5" updated="$6"
            local root="work/$label"
            mkdir -p "$root/package" "$root/nested" "$root/reports"

            echo "=== Download $label ==="
            curl --fail --location --retry 3 --retry-delay 3 "$url" -o "$root/package/kernel.tar.gz"
            echo "$expected_sha  $root/package/kernel.tar.gz" | sha256sum --check
            local actual_size
            actual_size="$(stat -c '%s' "$root/package/kernel.tar.gz")"
            [[ "$actual_size" == "$expected_size" ]] || {
              echo "::error::$label size mismatch: expected $expected_size, got $actual_size"
              return 1
            }

            {
              echo "Asset: $asset"
              echo "URL: $url"
              echo "Expected SHA256: $expected_sha"
              echo "Actual SHA256: $(sha256sum "$root/package/kernel.tar.gz" | awk '{print $1}')"
              echo "Expected size: $expected_size"
              echo "Actual size: $actual_size"
              echo "Asset updated: $updated"
            } | tee "$root/reports/package-metadata.txt"

            # Preserve the complete outer archive listing. Do not assume a fixed
            # directory layout or naming convention for nested archives.
            tar -tzf "$root/package/kernel.tar.gz" > "$root/reports/package-members.txt"
            cp "$root/reports/package-members.txt" "work/reports/$label-package-members.txt"
            sed -n '1,240p' "$root/reports/package-members.txt" > "$root/reports/package-members-first240.txt"

            : > "$root/reports/nested-archive-index.txt"
            : > "$root/reports/nested-content-index.txt"
            : > "$root/reports/dtb-audit.txt"
            : > "$root/reports/dtb-npu-properties.txt"
            : > "$root/reports/rknpu-builtin-audit.txt"

            local index=0
            while IFS= read -r member; do
              [[ "$member" =~ \.(tar\.gz|tgz)$ ]] || continue
              index=$((index + 1))
              local nested="$root/nested/archive-$index.tar.gz"
              local listing="$root/nested/archive-$index.members.txt"
              echo "$index $member" >> "$root/reports/nested-archive-index.txt"

              if ! tar -xOzf "$root/package/kernel.tar.gz" "$member" > "$nested" 2>/dev/null; then
                echo "UNREADABLE $member" >> "$root/reports/nested-content-index.txt"
                continue
              fi
              if ! gzip -t "$nested" 2>/dev/null || ! tar -tzf "$nested" > "$listing" 2>/dev/null; then
                echo "NOT_GZIP_TAR $member" >> "$root/reports/nested-content-index.txt"
                continue
              fi

              {
                echo "=== $member ==="
                echo "entries=$(wc -l < "$listing")"
                grep -Ei '(^|/)(Module.symvers|modules\.builtin|modules\.order|kernel\.release|\.config)$|\.dtb(\.gz)?$|(^|/)(Image|Image\.gz|vmlinuz)(-|$)' "$listing" | head -n 160 || true
              } >> "$root/reports/nested-content-index.txt"

              local extracted="$root/nested/extract-$index"
              mkdir -p "$extracted"
              tar -xzf "$nested" -C "$extracted"

              # Header/build-tree evidence.
              if grep -Eq '(^|/)Module\.symvers$|(^|/)include/config/kernel\.release$' "$listing"; then
                {
                  echo "=== Header candidate: $member ==="
                  find "$extracted" -type f \( -name .config -o -name Module.symvers -o -name modules.builtin -o -path '*/include/config/kernel.release' \) -print
                  while IFS= read -r f; do
                    case "$f" in
                      */include/config/kernel.release)
                        echo "kernel.release: $(cat "$f")"
                        ;;
                      */Module.symvers)
                        echo "PM runtime exported symbols:"
                        grep -E '[[:space:]]pm_runtime_(force_suspend|force_resume)([[:space:]]|$)' "$f" || true
                        ;;
                      */.config)
                        echo "Relevant .config:"
                        grep -E '^(CONFIG_(ARM64|MODULES|PM_DEVFREQ|ROCKCHIP_RKNPU|ROCKCHIP_RKNPU_DRM_GEM|ROCKCHIP_RKNPU_SRAM|IOMMU|ROCKCHIP_IOMMU)|# CONFIG_(ROCKCHIP_RKNPU|ROCKCHIP_IOMMU))' "$f" || true
                        ;;
                    esac
                  done < <(find "$extracted" -type f \( -name .config -o -name Module.symvers -o -path '*/include/config/kernel.release' \))
                } >> "$root/reports/header-audit.txt"
              fi

              # Module archive evidence: modules.builtin is authoritative for
              # drivers compiled into vmlinux; a listed *.ko path is not a loadable .ko.
              while IFS= read -r f; do
                {
                  echo "=== $member :: $f ==="
                  grep -Ei 'rknpu|rknn' "$f" || true
                } >> "$root/reports/rknpu-builtin-audit.txt"
              done < <(find "$extracted" -type f -name modules.builtin)

              # Boot/DTB evidence. Search every nested archive rather than only
              # archives whose outer filename happens to contain 'boot'.
              while IFS= read -r dtb; do
                [[ -n "$dtb" ]] || continue
                local base
                base="$(basename "$dtb")"
                echo "$member :: $dtb" >> "$root/reports/dtb-audit.txt"
                case "$base" in
                  *panther*|*rk3566*)
                    local dtb_file="$root/nested/$index-$base"
                    tar -xOzf "$nested" "$dtb" > "$dtb_file" 2>/dev/null || continue
                    dtc -I dtb -O dts -o "$root/reports/$base.dts" "$dtb_file" 2> "$root/reports/$base.dtc.log" || true
                    if [[ -s "$root/reports/$base.dts" ]]; then
                      {
                        echo "=== $base ==="
                        grep -n -E -B4 -A14 'rknpu|npu@fde40000|fde4b000|npu_irq|rknpu-supply|status = "okay"|status = "disabled"' "$root/reports/$base.dts" | head -n 240 || true
                      } >> "$root/reports/dtb-npu-properties.txt"
                    fi
                    ;;
                esac
              done < <(grep -Ei '\.dtb$' "$listing" || true)
            done < "$root/reports/package-members.txt"

            {
              echo "Nested archives: $index"
              echo
              echo "=== Nested archive index ==="
              cat "$root/reports/nested-archive-index.txt"
              echo
              echo "=== Candidate payloads ==="
              cat "$root/reports/nested-content-index.txt"
              echo
              echo "=== Header audit ==="
              cat "$root/reports/header-audit.txt" 2>/dev/null || true
              echo
              echo "=== Built-in RKNPU audit ==="
              cat "$root/reports/rknpu-builtin-audit.txt" 2>/dev/null || true
              echo
              echo "=== DTB audit ==="
              cat "$root/reports/dtb-audit.txt" 2>/dev/null || true
              echo
              echo "=== DTB NPU properties ==="
              cat "$root/reports/dtb-npu-properties.txt" 2>/dev/null || true
            } > "$root/reports/summary.txt"
          }

          audit_one standard "$OPHUB_RK35XX_PACKAGE_ASSET" "$OPHUB_RK35XX_PACKAGE_URL" "$OPHUB_RK35XX_PACKAGE_SHA256" "$OPHUB_RK35XX_PACKAGE_SIZE_BYTES" "$OPHUB_RK35XX_PACKAGE_UPDATED_AT"
          audit_one flippy "$OPHUB_RK35XX_FLIPPY_PACKAGE_ASSET" "$OPHUB_RK35XX_FLIPPY_PACKAGE_URL" "$OPHUB_RK35XX_FLIPPY_PACKAGE_SHA256" "$OPHUB_RK35XX_FLIPPY_PACKAGE_SIZE_BYTES" "$OPHUB_RK35XX_FLIPPY_PACKAGE_UPDATED_AT"

          {
            echo "# Ophub RK35xx 6.12.81 asset comparison"
            echo
            for label in standard flippy; do
              echo "## $label"
              cat "work/$label/reports/package-metadata.txt"
              echo
              cat "work/$label/reports/summary.txt"
              echo
            done
          } > work/reports/combined-comparison.md

      - name: Verify source and config reference snapshots
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.env
          mkdir -p work/source work/reports
          git clone --filter=blob:none --no-checkout "$OPHUB_RK35XX_KERNEL_SOURCE_REPO" work/source/kernel
          git -C work/source/kernel fetch --depth=1 origin "$OPHUB_RK35XX_KERNEL_SOURCE_COMMIT"
          git -C work/source/kernel checkout --detach FETCH_HEAD
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/ophub/kernel/$OPHUB_RK35XX_CONFIG_REF/$OPHUB_RK35XX_CONFIG_PATH" -o work/reports/config-6.12
          config_blob="$(git -C work/source/kernel hash-object "$GITHUB_WORKSPACE/work/reports/config-6.12")"
          {
            echo "=== Reference source ==="
            git -C work/source/kernel remote -v
            git -C work/source/kernel rev-parse HEAD
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' work/source/kernel/Makefile
            echo
            echo "=== Config reference ==="
            echo "Config blob SHA: $config_blob"
            echo "Expected config blob SHA: $OPHUB_RK35XX_CONFIG_BLOB_SHA"
            [[ "$config_blob" == "$OPHUB_RK35XX_CONFIG_BLOB_SHA" ]]
            echo "NOTE: Source/config references are not proven package provenance."
          } | tee work/reports/source-config-reference.txt

      - name: Upload package comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ophub-rk35xx-6.12.81-standard-vs-flippy
          path: work/
          if-no-files-found: warn
          retention-days: 30
